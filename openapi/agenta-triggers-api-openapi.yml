openapi: 3.2.0
info:
  title: Agenta Triggers API
  description: Agenta API
  contact:
    name: Agenta
    url: https://agenta.ai/
    email: team@agenta.ai
  version: 0.1.0
servers:
- url: /api
- url: https://eu.cloud.agenta.ai/api
security:
- APIKeyHeader: []
tags:
- name: Triggers
  description: Inbound provider event triggers and their watchable event catalog.
paths:
  /triggers/composio/events/:
    post:
      tags:
      - Triggers
      summary: Ingest Composio Event
      description: 'Receive a Composio provider event; verify, demux, ack-fast, enqueue.


        Public (no Agenta auth) — mirrors the Stripe events receiver. Scope and

        attribution are recovered downstream from the resolved subscription row.'
      operationId: ingest_composio_event
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerEventAck'
  /triggers/catalog/providers/:
    get:
      tags:
      - Triggers
      summary: List Providers
      operationId: list_trigger_providers
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerCatalogProvidersResponse'
  /triggers/catalog/providers/{provider_key}:
    get:
      tags:
      - Triggers
      summary: Get Provider
      operationId: fetch_trigger_provider
      parameters:
      - name: provider_key
        in: path
        required: true
        schema:
          type: string
          title: Provider Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerCatalogProviderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /triggers/catalog/providers/{provider_key}/integrations/:
