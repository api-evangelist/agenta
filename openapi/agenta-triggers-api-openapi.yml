      - Triggers
      summary: List Integrations
      operationId: list_trigger_integrations
      parameters:
      - name: provider_key
        in: path
        required: true
        schema:
          type: string
          title: Provider Key
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      - name: sort_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sort By
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerCatalogIntegrationsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /triggers/catalog/providers/{provider_key}/integrations/{integration_key}:
    get:
      tags:
      - Triggers
      summary: Get Integration
      operationId: fetch_trigger_integration
      parameters:
      - name: provider_key
        in: path
        required: true
        schema:
          type: string
          title: Provider Key
      - name: integration_key
        in: path
        required: true
        schema:
          type: string
          title: Integration Key
      responses:
        '200':
          description: Successful Response
