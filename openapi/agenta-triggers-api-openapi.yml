components:
  schemas:
    TriggerSubscription:
      properties:
        flags:
          $ref: '#/components/schemas/TriggerSubscriptionFlags'
        tags:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/LabelJson-Output'
            type: object
          - type: 'null'
          title: Tags
        meta:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/FullJson-Output'
            type: object
          - type: 'null'
          title: Meta
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
        deleted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Deleted At
        created_by_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Created By Id
        updated_by_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Updated By Id
        deleted_by_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Deleted By Id
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Id
        connection_id:
          type: string
          format: uuid
          title: Connection Id
        trigger_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trigger Id
        data:
          $ref: '#/components/schemas/TriggerSubscriptionData'
      type: object
      required:
      - connection_id
      - data
      title: TriggerSubscription
    TriggerCatalogEventsResponse:
      properties:
        count:
          type: integer
          title: Count
          default: 0
