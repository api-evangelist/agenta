openapi: 3.2.0
info:
  title: Agenta Applications API
  description: Agenta API
  contact:
    name: Agenta
    url: https://agenta.ai/
    email: team@agenta.ai
  version: 0.1.0
servers:
- url: /api
- url: https://eu.cloud.agenta.ai/api
security:
- APIKeyHeader: []
tags:
- name: Applications
  description: LLM applications — create, update, list, and delete apps.
paths:
  /applications/catalog/types/:
    get:
      tags:
      - Applications
      summary: List Application Catalog Types
      description: 'List shared catalog types.


        Catalog types are reusable JSON-Schema building blocks referenced from

        template schemas (for example `message`, `prompt-template`). Types are

        read-only and version with the product.

        See the Applications guide.'
      operationId: list_application_catalog_types
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationCatalogTypesResponse'
  /applications/catalog/templates/:
    get:
      tags:
      - Applications
      summary: List Application Catalog Templates
      description: 'List application templates available in the catalog.


        Templates describe the handler (`uri`) and JSON schemas used to create

        a new application. Pass `include_archived=true` to include retired

        templates (useful when editing applications created from an old

        template). Templates are global and read-only.'
      operationId: list_application_catalog_templates
      parameters:
      - name: include_archived
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Include Archived
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationCatalogTemplatesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/catalog/templates/{template_key}:
    get:
      tags:
      - Applications
      summary: Fetch Application Catalog Template
      description: 'Fetch one application template by key.


        Use this to inspect the exact `uri`, `data`, and JSON Schemas for a

        template before creating an application from it. `template_key` comes

        from the `key` field of a template returned by the list endpoint

        (for example `completion`, `chat`, `hook`).'
      operationId: fetch_application_catalog_template
      parameters:
      - name: template_key
        in: path
        required: true
        schema:
          type: string
          title: Template Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationCatalogTemplateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/catalog/templates/{template_key}/presets/:
    get:
      tags:
      - Applications
      summary: List Application Catalog Presets
      description: 'List presets scoped to a template.


        Presets are named parameter sets (for example a curated prompt +

        model combination) that scaffold the first revision when creating an

        application from a template. Pass `include_archived=true` to include

        retired presets.'
      operationId: list_application_catalog_presets
      parameters:
      - name: template_key
        in: path
        required: true
        schema:
          type: string
          title: Template Key
      - name: include_archived
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Include Archived
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationCatalogPresetsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/catalog/templates/{template_key}/presets/{preset_key}:
    get:
      tags:
      - Applications
      summary: Fetch Application Catalog Preset
      description: 'Fetch one preset by key within a template.


        Returns the preset''s `data` so clients can use it as the payload for a

        first revision when creating an application from a template.'
      operationId: fetch_application_catalog_preset
      parameters:
      - name: template_key
        in: path
        required: true
        schema:
          type: string
          title: Template Key
      - name: preset_key
        in: path
        required: true
        schema:
          type: string
          title: Preset Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationCatalogPresetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/:
    post:
      tags:
      - Applications
      summary: Create Application
      description: 'Create an application artifact only.


        Returns an empty application without any variants or revisions.

        Most callers should use `POST /simple/applications/` instead — it

        creates the artifact, a default variant, and a first committed

        revision in one request.

        See the Applications guide.'
      operationId: create_application
      parameters:
      - name: application_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Application Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/{application_id}:
    get:
      tags:
      - Applications
      summary: Fetch Application
      description: 'Fetch one application artifact by ID.


        Returns artifact-level fields only. To get the current variant,

        revision, and `data` in a single call, use

        `GET /simple/applications/{application_id}`.'
      operationId: fetch_application
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Applications
      summary: Edit Application
      description: 'Edit artifact-level fields on an application.


        Editable fields: `description`, `flags`, `tags`, `meta`. Editing `name`

        is currently disabled and returns `400`. Prompt or model-parameter

        changes go through `POST /applications/revisions/commit`, not this

        endpoint.'
      operationId: edit_application
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Application Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationEditRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/{application_id}/archive:
    post:
      tags:
      - Applications
      summary: Archive Application
      description: 'Soft-delete an application.


        Archiving sets `deleted_at` on the application and hides it from

        queries that don''t set `include_archived: true`. Its variants and

        revisions become unreachable from listing but their IDs remain

        resolvable so historical traces stay intact.

        See Versioning.'
      operationId: archive_application
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/{application_id}/unarchive:
    post:
      tags:
      - Applications
      summary: Unarchive Application
      description: 'Restore a previously archived application.


        Clears `deleted_at` and makes the application visible to standard

        queries again. Safe to call on an already-active application; it is a

        no-op in that case.'
      operationId: unarchive_application
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/query:
    post:
      tags:
      - Applications
      summary: Query Applications
      description: 'Query application artifacts.


        Returns only artifact-level fields; the variant, revision, and `data`

        payload are not included. For one row per application with those

        merged in, use `POST /simple/applications/query`.

        See Query Pattern.'
      operationId: query_applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/variants/:
    post:
      tags:
      - Applications
      summary: Create Application Variant
      description: 'Create a new variant on an existing application.


        A variant is an independent branch of the application''s history. The

        new variant starts empty — call `POST /applications/revisions/commit`

        to add its first revision. Use `POST /applications/variants/fork` when

        you want the new variant to inherit an existing revision history.'
      operationId: create_application_variant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationVariantCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/variants/{application_variant_id}:
    get:
      tags:
      - Applications
      summary: Fetch Application Variant
      description: 'Fetch one variant by ID.


        Returns variant-level fields. To get the variant''s tip revision and

        its `data`, call `POST /applications/revisions/retrieve` with

        `application_variant_ref`.'
      operationId: fetch_application_variant
      parameters:
      - name: application_variant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Application Variant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Applications
      summary: Edit Application Variant
      description: 'Edit a variant''s header fields (`name`, `description`, `tags`, `meta`).


        Configuration changes go through a new commit via

        `POST /applications/revisions/commit`. This endpoint only touches

        variant-level metadata.'
      operationId: edit_application_variant
      parameters:
      - name: application_variant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Application Variant Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationVariantEditRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/variants/{application_variant_id}/archive:
    post:
      tags:
      - Applications
      summary: Archive Application Variant
      description: 'Soft-delete a variant.


        The variant and its revisions are hidden from queries unless

        `include_archived: true` is sent. Revision IDs remain resolvable so

        historical traces are preserved.'
      operationId: archive_application_variant
      parameters:
      - name: application_variant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Application Variant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/variants/{application_variant_id}/unarchive:
    post:
      tags:
      - Applications
      summary: Unarchive Application Variant
      description: Restore a previously archived variant.
      operationId: unarchive_application_variant
      parameters:
      - name: application_variant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Application Variant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/variants/query:
    post:
      tags:
      - Applications
      summary: Query Application Variants
      description: 'Query variants across one or more applications.


        Filters are parsed from both query-string parameters and the request

        body; body values take precedence. Use `application_refs` to scope to

        specific applications, `application_variant_refs` to narrow to

        specific variants.

        See Query Pattern.'
      operationId: query_application_variants
      parameters:
      - name: application_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Application Id
      - name: application_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          title: Application Ids
      - name: application_slug
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Application Slug
      - name: application_slugs
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Application Slugs
      - name: application_variant_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Application Variant Id
      - name: application_variant_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          title: Application Variant Ids
      - name: application_variant_slug
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Application Variant Slug
      - name: application_variant_slugs
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Application Variant Slugs
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      - name: description
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      - name: flags
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Flags
      - name: tags
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tags
      - name: meta
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Meta
      - name: include_archived
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Include Archived
      - name: next
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Next
      - name: newest
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Newest
      - name: oldest
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Oldest
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
      - name: order
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - ascending
            - descending
            type: string
          - type: 'null'
          title: Order
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationVariantsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/variants/fork:
    post:
      tags:
      - Applications
      summary: Fork Application Variant
      description: 'Fork an existing variant into a new variant on the same application.


        Use this to experiment without touching the source variant''s history.

        The fork copies the source variant''s revisions up to the specified

        revision (or tip) into the new variant, then commits the supplied

        `revision` object on top. Both `variant` and `revision` sub-objects

        in the request must be present; the server returns `count: 0` when

        either is missing. Returns `400 Bad Request` if the fork target is

        invalid (for example, the source variant or revision cannot be

        located in this application''s lineage).'
      operationId: fork_application_variant
      parameters:
      - name: application_variant_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Application Variant Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationVariantForkRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/revisions/retrieve:
    post:
      tags:
      - Applications
      summary: Retrieve Application Revision
      description: 'Retrieve one application revision by reference.


        Accepts application / variant / revision references for direct lookup,

        or an environment reference (with optional `key`) to resolve the

        currently-deployed revision in that environment. Returns the revision

        including its `data` payload (URL, parameters, schemas), which clients

        use to invoke the application.

        Set `resolve: true` to inline embedded references inside `data`.'
      operationId: retrieve_application_revision
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationRevisionRetrieveRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/revisions/deploy:
    post:
      tags:
      - Applications
      summary: Deploy Application Revision
      description: 'Deploy an application revision to an environment.


        Writes a reference from the environment revision to the application

        revision under `key` (default: `{application_slug}.revision`). Clients

        that subsequently call `/applications/revisions/retrieve` with the

        same `environment_ref` and `key` resolve to this revision.

        See the Applications guide.'
      operationId: deploy_application_revision
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationRevisionDeployRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/revisions/:
    post:
      tags:
      - Applications
      summary: Create Application Revision
      description: 'Create and commit the initial revision for an application variant.


        Advanced use only. For normal development loops prefer

        `POST /applications/revisions/commit`, which commits the new revision

        as the variant''s tip and assigns a version number.'
      operationId: create_application_revision
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationRevisionCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/revisions/{application_revision_id}:
    get:
      tags:
      - Applications
      summary: Fetch Application Revision
      description: 'Fetch one revision by its ID.


        Returns the revision including its `data` payload. For lookup by

        variant slug or environment, use `POST /applications/revisions/retrieve`.'
      operationId: fetch_application_revision
      parameters:
      - name: application_revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Application Revision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Applications
      summary: Edit Application Revision
      description: 'Edit a revision''s header fields only.


        Revisions are immutable snapshots; `data`, `author`, `date`, and

        `message` cannot be changed. This endpoint updates header fields such

        as `description` and `tags`. To change configuration, commit a new

        revision with `POST /applications/revisions/commit`.'
      operationId: edit_application_revision
      parameters:
      - name: application_revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Application Revision Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationRevisionEditRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/revisions/{application_revision_id}/archive:
    post:
      tags:
      - Applications
      summary: Archive Application Revision
      description: 'Soft-delete a revision.


        Archived revisions are hidden from `/query` and `/log` responses

        unless `include_archived: true` is set. The ID remains resolvable for

        traces and deployed environment references.'
      operationId: archive_application_revision
      parameters:
      - name: application_revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Application Revision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/revisions/{application_revision_id}/unarchive:
    post:
      tags:
      - Applications
      summary: Unarchive Application Revision
      description: Restore a previously archived revision.
      operationId: unarchive_application_revision
      parameters:
      - name: application_revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Application Revision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/revisions/query:
    post:
      tags:
      - Applications
      summary: Query Application Revisions
      description: 'Query revisions across one or more applications or variants.


        Use `application_refs` / `application_variant_refs` to scope the

        query, or filter on commit metadata (`author`, `date`, `message`) via

        the `application_revision` object. For the ordered history of a

        single variant, `POST /applications/revisions/log` is more direct.'
      operationId: query_application_revisions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationRevisionQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRevisionsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/revisions/commit:
    post:
      tags:
      - Applications
      summary: Commit Application Revision
      description: 'Commit a new revision on a variant.


        The new revision becomes the variant''s tip and is assigned the next

        `version` number. Revisions are immutable once committed; to change

        configuration, commit a new revision.

        See Versioning.'
      operationId: commit_application_revision
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationRevisionCommitRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/revisions/log:
    post:
      tags:
      - Applications
      summary: Log Application Revisions
      description: 'Return the ordered revision log for a variant.


        Pass `application_variant_id` to list the full history of that

        variant; optionally pass `application_revision_id` + `depth` to walk

        back a bounded number of commits from a specific revision. Entries

        are returned newest-first and include the full revision record.'
      operationId: log_application_revisions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationRevisionsLogRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRevisionsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/revisions/resolve:
    post:
      tags:
      - Applications
      summary: Resolve Application Revision
      description: 'Fetch a revision with embedded references inlined.


        When a revision''s `data` carries references to other entities

        (snippets, linked revisions), this endpoint resolves them in place and

        returns the fully-inlined configuration along with `resolution_info`

        describing what was substituted. Use it when clients need a

        self-contained configuration for invocation or export.'
      operationId: resolve_application_revision
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationRevisionResolveRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRevisionResolveResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simple/applications/:
    post:
      tags:
      - Applications
      summary: Create Simple Application
      description: 'Create an application end-to-end.


        Creates the application artifact, a default variant, and a first

        committed revision whose `data` comes from the request. This is the

        recommended entry point for "spin up a new application from a

        template". For more control over variant and revision creation, use

        the structured endpoints under `/applications/`.

        See Simple Endpoints.'
      operationId: create_simple_application
      parameters:
      - name: application_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Application Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimpleApplicationCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleApplicationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simple/applications/query:
    post:
      tags:
      - Applications
      summary: Query Simple Applications
      description: 'Query applications with variant, revision, and `data` merged per row.


        This is the shape most clients want for dashboards or invocation

        pickers: each row carries `variant_id`, `revision_id`, and `data`

        (URL, parameters, schemas) alongside the artifact fields. For the

        structured query that returns artifacts only, use

        `POST /applications/query`.'
      operationId: query_simple_applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimpleApplicationQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleApplicationsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simple/applications/{application_id}:
    get:
      tags:
      - Applications
      summary: Fetch Simple Application
      description: 'Fetch one application with its current variant, revision, and `data` merged.


        The returned `data` includes the invocation `url`, the `parameters`

        the revision was committed with, and the JSON `schemas` for inputs,

        outputs, and parameters.'
      operationId: fetch_simple_application
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleApplicationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Applications
      summary: Edit Simple Application
      description: 'Edit an application and commit a new revision if configuration changed.


        Fields other than `id` in the request body are treated as changes and

        produce a new committed revision. Supplying `data` changes the

        configuration; supplying only header fields (`flags`, `tags`, `meta`)

        still produces a new revision with the updated header but the

        existing `data`. Editing the application `name` is currently

        disabled and returns `400`.'
      operationId: edit_simple_application
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Application Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimpleApplicationEditRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleApplicationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simple/applications/{application_id}/archive:
    post:
      tags:
      - Applications
      summary: Archive Simple Application
      description: 'Archive an application through the simple endpoint layer.


        Equivalent to `POST /applications/{application_id}/archive`; returns

        the archived application in the simple shape (with its last known

        variant, revision, and `data`).'
      operationId: archive_simple_application
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleApplicationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simple/applications/{application_id}/unarchive:
    post:
      tags:
      - Applications
      summary: Unarchive Simple Application
      description: 'Unarchive an application through the simple endpoint layer.


        Equivalent to `POST /applications/{application_id}/unarchive`, with

        the response shape of `/simple/applications/`.'
      operationId: unarchive_simple_application
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleApplicationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    SimpleApplicationEditRequest:
      properties:
        application:
          $ref: '#/components/schemas/SimpleApplicationEdit'
          description: Fields to change. `id` must match the path. Supplying `data` commits a new revision with that configuration; supplying `flags`/`tags`/`meta` commits a revision with the updated header but the existing `data`.
      type: object
      required:
      - application
      title: SimpleApplicationEditRequest
      description: 'Request body for `PUT /simple/applications/{application_id}`.


        Commits a new revision on the application''s variant whenever fields other

        than `id` are present. If only `id` is sent, the current state is returned

        without committing.'
    ApplicationRevisionDeployRequest:
      properties:
        application_ref:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
          description: Application reference. If provided, the latest revision of the default variant is deployed.
        application_variant_ref:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
          description: Variant reference. Its latest revision is deployed.
        application_revision_ref:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
          description: Revision reference. The exact revision is deployed.
        environment_ref:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
          description: 'Target environment (for example `{"slug": "production"}`).'
        environment_variant_ref:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
          description: Target environment variant.
        environment_revision_ref:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
          description: Target environment revision; advanced use only.
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
          description: Deployment key inside the environment revision. Defaults to `{application_slug}.revision`.
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: Optional commit message attached to the environment revision.
      type: object
      title: ApplicationRevisionDeployRequest
      description: 'Request body for `POST /applications/revisions/deploy`.


        Attaches an application revision to an environment under a key. Subsequent

        calls to `/applications/revisions/retrieve` with the matching

        `environment_ref` resolve to this revision.

        See the [Applications guide](/reference/api-guide/applications#deployment).'
    ApplicationEditRequest:
      properties:
        application:
          $ref: '#/components/schemas/ApplicationEdit'
          description: Artifact fields to update. The `id` must match the `application_id` in the URL path.
      type: object
      required:
      - application
      title: ApplicationEditRequest
      description: 'Request body for editing an application artifact.


        Only artifact-level fields (flags, tags, meta) can be edited here. Editing

        the `name` is currently disabled. To change the prompt or model parameters,

        commit a new revision on a variant with `/applications/revisions/commit`.'
    ApplicationCatalogTemplate:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        key:
          type: string
          title: Key
        slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Slug
        categories:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Categories
        flags:
          anyOf:
          - $ref: '#/components/schemas/WorkflowCatalogFlags'
          - type: 'null'
        data:
          anyOf:
          - $ref: '#/components/schemas/WorkflowRevisionData-Output'
          - type: 'null'
      type: object
      required:
      - key
      title: ApplicationCatalogTemplate
    ApplicationFlags:
      properties:
        is_application:
          type: boolean
          title: Is Application
          default: false
        is_evaluator:
          type: boolean
          title: Is Evaluator
          default: false
        is_snippet:
          type: boolean
          title: Is Snippet
          default: false
        is_managed:
          type: boolean
          title: Is Managed
          default: false
        is_custom:
          type: boolean
          title: Is Custom
          default: false
        is_llm:
          type: boolean
          title: Is Llm
          default: false
        is_hook:
          type: boolean
          title: Is Hook
          default: false
        is_code:
          type: boolean
          title: Is Code
          default: false
        is_match:
          type: boolean
          title: Is Match
          default: false
        is_feedback:
          type: boolean
          title: Is Feedback
          default: false
        is_agent:
          type: boolean
          title: Is Agent
          default: false
        is_skill:
          type: boolean
          title: Is Skill
          default: false
        is_chat:
          type: boolean
          title: Is Chat
          default: false
        has_url:
          type: boolean
          title: Has Url
          default: false
        has_script:
          type: boolean
          title: Has Script
          default: false
        has_handler:
          type: boolean
          title: Has Handler
          default: false
        is_static:
          type: boolean
          title: Is Static
          default: false
      type: object
      title: ApplicationFlags
      description: Legacy full application flag set.
    ApplicationVariantEditRequest:
      properties:
        application_variant:
          $ref: '#/components/schemas/ApplicationVariantEdit'
          description: Full variant body. Edit replaces the artifact-level fields in a single PUT, so include every editable field even if its value is unchanged. `id` must match the `application_variant_id` in the URL path; `slug` is immutable. Configuration changes (prompt, model parameters) go through `/applications/revisions/commit`, not this endpoint.
      type: object
      required:
      - application_variant
      title: ApplicationVariantEditRequest
      description: Request body for editing a variant's artifact-level fields.
    ApplicationRevisionEdit:
      properties:
        flags:
          anyOf:
          - $ref: '#/components/schemas/ApplicationFlags'
          - type: 'null'
        tags:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/LabelJson-Input'
            type: object
          - type: 'null'
          title: Tags
        meta:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/FullJson-Input'
            type: object
          - type: 'null'
          title: Meta
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Id
      type: object
      title: ApplicationRevisionEdit
    ApplicationVariantFlags:
      properties:
        is_application:
          type: boolean
          title: Is Application
          default: false
        is_evaluator:
          type: boolean
          title: Is Evaluator
          default: false
        is_snippet:
          type: boolean
          title: Is Snippet
          default: false
      type: object
      title: ApplicationVariantFlags
    WorkflowRevisionOperation:
      properties:
        operation:
          type: string
          enum:
          - set
          - merge
          - remove
          - edit_text
          - add_item
          - replace_item
          - remove_item
          title: Operation
        target:
          items: {}
          type: array
          title: Target
        value:
          anyOf:
          - {}
          - type: 'null'
          title: Value
        edits:
          anyOf:
          - items:
              additionalProperties:
                type: string
              type: object
            type: array
          - type: 'null'
          title: Edits
        match_mode:
          anyOf:
          - type: string
            enum:
            - auto
            - exact
          - type: 'null'
          title: Match Mode
      additionalProperties: false
      type: object
      required:
      - operation
      - target
      title: WorkflowRevisionOperation
      description: 'One ordered operation. The new delta arm (agent-config-editing, contract 3.2).


        ``extra="forbid"`` applies to this NEW model only. The legacy ``set``/``remove`` arm

        stays permissive on purpose: tightening it would reject payloads that shipped

        playbooks send today and that the server has always ignored.'
    ApplicationCreateRequest:
      properties:
        application:
          $ref: '#/components/schemas/ApplicationCreate'
          description: 'Artifact-level fields for the new application: `slug`, `name`, `description`, `flags`, `tags`, `meta`. The `slug` must be unique within the project.'
      type: object
      required:
      - application
      title: ApplicationCreateRequest
      description: 'Request body for creating an application artifact.


        Applications are versioned resources; creating one produces an empty artifact.

        Use `POST /simple/applications/` if you want to create the artifact, a default

        variant, and a first committed revision in a single call.

        See the [Applications guide](/reference/api-guide/applications).'
    ApplicationCatalogTypesResponse:
      properties:
        count:
          type: integer
          title: Count
          description: Number of types returned.
          default: 0
        types:
          items:
            $ref: '#/components/schemas/ApplicationCatalogType'
          type: array
          title: Types
          description: Shared JSON Schema building blocks referenced by templates (for example `message`, `prompt-template`).
      type: object
      title: ApplicationCatalogTypesResponse
      description: List of catalog types.
    ApplicationRevisionFlags:
      properties:
        is_application:
          type: boolean
          title: Is Application
          default: false
        is_evaluator:
          type: boolean
          title: Is Evaluator
          default: false
        is_snippet:
          type: boolean
          title: Is Snippet
          default: false
        is_managed:
          type: boolean
          title: Is Managed
          default: false
        is_custom:
          type: boolean
          title: Is Custom
          default: false
        is_llm:
          type: boolean
          title: Is Llm
          default: false
        is_hook:
          type: boolean
          title: Is Hook
          default: false
        is_code:
          type: boolean
          title: Is Code
          default: false
        is_match:
          type: boolean
          title: Is Match
          default: false
        is_feedback:
          type: boolean
          title: Is Feedback
          default: false
        is_agent:
          type: boolean
          title: Is Agent
          default: false
        is_skill:
          type: boolean
          title: Is Skill
          default: false
        is_chat:
          type: boolean
          title: Is Chat
          default: false
        has_url:
          type: boolean
          title: Has Url
          default: false
        has_script:
          type: boolean
          title: Has Script
          default: false
        has_handler:
          type: boolean
          title: Has Handler
          default: false
        is_static:
          type: boolean
          title: Is Static
          default: false
      type: object
      title: ApplicationRevisionFlags
    ErrorPolicy:
      type: string
      enum:
      - exception
      - placeholder
      - keep
      title: ErrorPolicy
    ApplicationRevisionResponse:
      properties:
        count:
          type: integer
          title: Count
          description: '`1` when a revision was found, `0` otherwise.'
          default: 0
        application_revision:
          anyOf:
          - $ref: '#/components/schemas/ApplicationRevision-Output'
          - type: 'null'
          description: The application revision, including its `data` payload (prompt, model parameters, schemas, URL).
        resolution_info:
          anyOf:
          - $ref: '#/components/schemas/ResolutionInfo'
          - type: 'null'
          description: 'Present only when the request set `resolve: true`. Describes which embedded references were resolved and any errors that occurred.'
        retrieval_info:
          anyOf:
          - $ref: '#/components/schemas/RetrievalInfo'
          - type: 'null'
          description: References used to retrieve the top-level revision.
      type: object
      title: ApplicationRevisionResponse
      description: Single-revision response envelope.
    JsonSchemas-Input:
      properties:
        parameters:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/FullJson-Input'
            type: object
          - type: 'null'
          title: Parameters
        inputs:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/FullJson-Input'
            type: object
          - type: 'null'
          title: Inputs
        outputs:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/FullJson-Input'
            type: object
          - type: 'null'
          title: Outputs
      type: object
      title: JsonSchemas
    PlaygroundBuildKitContext:
      properties:
        op_access:
          additionalProperties:
            type: string
            enum:
            - read
            - write
          type: object
          title: Op Access
        agent_template_overlay:
          anyOf:
          - $ref: '#/components/schemas/AgentTemplateOverlay'
          - type: 'null'
          description: Partial `parameters.agent` overlay applied by the playground only.
      type: object
      title: PlaygroundBuildKitContext
      description: Read-only playground build-kit context for one inspect/fetch response.
    WorkflowRevisionDelta:
      properties:
        set:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Set
        remove:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Remove
        operations:
          anyOf:
          - items:
              $ref: '#/components/schemas/WorkflowRevisionOperation'
            type: array
          - type: 'null'
          title: Operations
      type: object
      title: WorkflowRevisionDelta
      description: "Delta operations on a workflow revision's data tree.\n\nTwo forms, never mixed (contract 3):\n\n- **legacy** — ``set``: a partial data tree deep-merged onto the base revision's data\n  (nested dicts merge; scalars and lists replace); ``remove``: dotted key paths to\n  delete (e.g. ``parameters.agent.tools``).\n- **ordered** — ``operations``: the seven verbs, applied in array order, all or\n  nothing.\n\nThe engine enforces the exclusivity and every operation rule; this model only carries\nthe shapes.\n\nUnknown keys beside ``set``/``remove``/``operations`` are refused on the ORDERED arm\nonly, so a caller cannot believe it sent an operation modifier the server never saw.\nA pure-legacy envelope keeps its shipped tolerance: the server has always ignored\nstray keys there, and playbooks in the field send them. Neither rule reaches the tree\ninside ``set``, which stays free-form."
    ResolutionInfo:
      properties:
        references_used:
          items:
            additionalProperties:
              $ref: '#/components/schemas/Reference'
            type: object
          type: array
          title: References Used
        depth_reached:
          type: integer
          title: Depth Reached
        embeds_resolved:
          type: integer
          title: Embeds Resolved
        errors:
          items:
            type: string
          type: array
          title: Errors
          default: []
      type: object
      required:
      - references_used
      - depth_reached
      - embeds_resolved
      title: ResolutionInfo
    ApplicationCatalogType:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        key:
          type: string
          title: Key
        json_schema:
          additionalProperties:
            $ref: '#/components/schemas/FullJson-Output'
          type: object
          title: Json Schema
      type: object
      required:
      - key
      - json_schema
      title: ApplicationCatalogType
    ApplicationCreate:
      properties:
        folder_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Folder Id
        flags:
          anyOf:
          - $ref: '#/components/schemas/ApplicationFlags'
          - type: 'null'
        tags:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/LabelJson-Input'
            type: object
          - type: 'null'
          title: Tags
        meta:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/FullJson-Input'
            type: object
          - type: 'null'
          title: Meta
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Slug
      type: object
      title: ApplicationCreate
    SimpleApplicationFlags:
      properties:
        is_application:
