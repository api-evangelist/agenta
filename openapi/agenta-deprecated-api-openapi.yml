openapi: 3.2.0
info:
  title: Agenta Deprecated API
  description: Agenta API
  contact:
    name: Agenta
    url: https://agenta.ai/
    email: team@agenta.ai
  version: 0.1.0
servers:
- url: /api
- url: https://eu.cloud.agenta.ai/api
security:
- APIKeyHeader: []
tags:
- name: Deprecated
  description: Deprecated endpoints kept for backwards compatibility — avoid in new integrations.
paths:
  /tracing/spans/ingest:
    post:
      tags:
      - Deprecated
      summary: Ingest Spans
      description: 'Ingest spans into the tracing backend.


        Use this endpoint to write full OpenTelemetry-style spans — including

        multi-span hierarchies (parent → child → grandchild), attributes,

        references, events and links. For simple single-span annotations or

        evaluator outputs, prefer `POST /preview/tracing/traces/`

        (`create_simple_trace`) — it''s a higher-level helper on top of this

        endpoint.


        ## Request body


        Provide exactly one of:


        - `spans`: a flat list of spans. Parent/child relationships are

        expressed via `parent_id` on each span.

        - `traces`: a nested tree keyed by `trace_id` then by span name,

        where each node may contain a `spans` dict of its children. The

        query endpoint (`POST /tracing/spans/query`) returns this shape.


        Each span requires `trace_id`, `span_id`, `start_time`, `end_time`.

        `trace_id` must be a 32-char hex UUID, `span_id` a 16-char hex.

        Attributes follow the Agenta convention under the `ag` namespace

        (`ag.type`, `ag.data`, `ag.metrics`, `ag.references`) and may be

        submitted either as a flat dotted map (OTel wire format) or as a

        nested object — both are accepted.


        ## Response


        Returns `202 Accepted` with the links (`trace_id` + `span_id`) for

        the spans that were parsed into the ingest stream. See

        Tracing — Async write

        contract

        for what `count < N submitted` means.


        ## Example


        ```json

        {

        "spans": [

        {

        "trace_id": "f5a2efb40895881e938e2ebc070beca8",

        "span_id": "15f3df0731995245",

        "span_name": "completion_v0",

        "span_type": "workflow",

        "span_kind": "SPAN_KIND_SERVER",

        "start_time": "2026-04-16T18:18:18.491929Z",

        "end_time": "2026-04-16T18:18:20.415372Z",

        "attributes": {

        "ag.type.trace": "invocation",

        "ag.type.span": "workflow",

        "ag.data.inputs.country": "France",

        "ag.data.outputs": "Paris"

        }

        }

        ]

        }

        ```'
      operationId: ingest_spans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTelTracingRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTelLinksResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      deprecated: true
  /tracing/spans/query:
    post:
      tags:
      - Deprecated
      summary: Query Spans
      description: 'Query spans and traces in the tracing backend.


        Use `focus` in the request body to control the response shape:


        - `"trace"` (default): returns a nested `traces` tree keyed by

        `trace_id` then by span name. Children hang off their parent''s

        `spans` field. Best for rendering a trace waterfall.

        - `"span"`: returns a flat `spans` list. Best for paginating or

        filtering across all spans regardless of hierarchy.


        Use `oldest` / `newest` (unix seconds) to window the query and

        `limit` to cap the number of traces/spans returned. One response holds

        at most one page: 100 rows when `limit` is not set, and never more than

        1000 (the server settings `AGENTA_API_TRACING_QUERY_DEFAULT_LIMIT` and

        `AGENTA_API_TRACING_QUERY_MAX_LIMIT`). When the page is full, the

        response has a `windowing` object: send it as `windowing` to read the

        next page.


        Span `attributes` here leave out `ag.data.parameters.agent.skills` (the

        skill text of an agent run). To read a whole trace, filter only on

        `trace_id`, or call `GET /traces/{trace_id}`.


        The response preserves the Agenta `ag.*` attribute namespace and

        includes computed metrics (`ag.metrics.duration`, `ag.metrics.tokens`,

        `ag.metrics.costs`) on each span. The `traces` tree returned here is

        the same shape that `POST /tracing/spans/ingest` accepts as its

        `traces` field.'
      operationId: query_spans_rpc
      deprecated: true
      parameters:
      - name: focus
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Focus'
          - type: 'null'
          title: Focus
      - name: format
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Format'
          - type: 'null'
          title: Format
      - name: oldest
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: integer
          - type: 'null'
          title: Oldest
      - name: newest
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: integer
          - type: 'null'
          title: Newest
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
      - name: interval
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Interval
      - name: rate
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: Rate
      - name: filter
        in: query
        required: false
        schema:
          title: Filter
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTelTracingResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tracing/analytics/query:
    post:
      tags:
      - Deprecated
      summary: Fetch Analytics
      description: 'Aggregate span metrics into time buckets.


        Runs filtering and windowing identical to `POST /tracing/spans/query`,

        then bucketizes the matched spans by time and computes one or more

        metric summaries per bucket. Use this to build charts of latency,

        cost, token usage, or custom numeric and categorical attributes.


        ## Request body


        - `filtering` — same shape as the query endpoint, scoped to the spans

        that contribute to the analytics.

        - `windowing` — `oldest`/`newest` for the time range (matched against

        each span''s `start_time`), `interval` for bucket width (in minutes),

        and an optional `rate` to sample a share of the traces. Figures

        describe the sample only. When `interval` is set, buckets with no spans are returned empty.

        - `formatting.focus` — `trace` (default) summarizes root spans only,

        which carry the cumulative metrics of their trace. `span`

        summarizes every span.

        - `specs` — a list of `MetricSpec` entries describing which

        attributes to summarize and how. Each spec declares a `type`

        (`numeric/continuous`, `numeric/discrete`, `binary`,

        `categorical/single`, `categorical/multiple`, `string`, `json`,

        or `*` for auto) and a dotted `path` into the span (for example

        `attributes.ag.metrics.costs.cumulative.total`).


        ## Response


        Buckets are returned in chronological order. Each bucket carries a

        `metrics` dict keyed by spec path. See Tracing — the ag.*

        namespace

        for the cumulative/incremental metric layout on each span.


        ## Errors


        - `504` — the query ran past the database statement timeout. Retry

        with a shorter time range. Other failures still return an empty

        result.'
      operationId: query_analytics
      deprecated: true
      parameters:
      - name: focus
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Focus'
          - type: 'null'
          title: Focus
      - name: format
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Format'
          - type: 'null'
          title: Format
      - name: oldest
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: integer
          - type: 'null'
          title: Oldest
      - name: newest
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: integer
          - type: 'null'
          title: Newest
      - name: interval
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Interval
      - name: rate
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: Rate
      - name: filter
        in: query
        required: false
        schema:
          title: Filter
      - name: specs
        in: query
        required: false
        schema:
          title: Specs
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
        '504':
          description: The analytics query ran past the database statement timeout. `detail` carries a message; retry with a shorter time range.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tracing/traces/:
    post:
      tags:
      - Deprecated
      summary: Create Trace
      description: 'Create a trace from one or more spans.


        This is the single-trace counterpart to `POST /tracing/spans/ingest`.

        Accepts the same `OTelTracingRequest` body (either `spans` flat list

        or `traces` nested tree) but requires all spans to share a single

        `trace_id`.


        Returns `202 Accepted` with the links for the spans that entered

        the ingest stream. See Tracing — Async write

        contract.


        Most callers should prefer `POST /tracing/spans/ingest` (no

        single-trace restriction) or `POST /simple/traces/` (helper for a

        one-span payload).'
      operationId: create_trace_tracing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTelTracingRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTelLinksResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      deprecated: true
  /tracing/traces/{trace_id}:
    get:
      tags:
      - Deprecated
      summary: Fetch Trace
      description: 'Fetch a single trace by `trace_id`.


        Returns the trace as a `traces` map keyed by `trace_id` → span

        name. The response is empty when the trace is not in the current

        project. `trace_id` must be a 32-char hex UUID; any other format

        returns `400`.


        For flat-list retrieval across many traces, use

        `POST /tracing/spans/query` with `focus="span"`.'
      operationId: fetch_trace_tracing
      deprecated: true
      parameters:
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
          title: Trace Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTelTracingResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Deprecated
      summary: Edit Trace
      description: 'Replace the spans of an existing trace.


        The path `trace_id` must match the `trace_id` in the payload.

        Mismatches return `400`. The payload must contain exactly one

        trace; submitting spans from more than one trace returns `400`.


        Edit is implemented as a re-ingest: the new spans are written

        through the same stream as `POST /tracing/spans/ingest`, and the

        `202 Accepted` response reports how many spans entered the stream.

        The worker reconciles the trace asynchronously.'
      operationId: edit_trace_tracing
      deprecated: true
      parameters:
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
          title: Trace Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTelTracingRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTelLinksResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Deprecated
      summary: Delete Trace
      description: 'Delete a trace and all its spans.


        Removes every span that shares this `trace_id` within the project.

        Returns `202 Accepted` with the links for the spans that were

        marked for deletion. `trace_id` must be a 32-char hex UUID.


        Deletion is not reversible. For soft-removal semantics on a

        single-trace simple annotation, prefer

        `DELETE /simple/traces/{trace_id}`.'
      operationId: delete_trace_tracing
      deprecated: true
      parameters:
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
          title: Trace Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTelLinksResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tracing/sessions/query:
    post:
      tags:
      - Deprecated
      summary: List Sessions
      description: 'List distinct session IDs from span attributes.


        Returns the distinct values of `ag.session.id` across spans in the

        current project, in a windowed, cursor-paginated form. Use this to

        drive a session-picker UI before drilling into the spans of each

        session.


        The `realtime` flag controls the cursor field:


        - `false` or unset — paginate by a stable `first_active` cursor

        (safe to iterate under heavy write load).

        - `true` — paginate by `last_active`, reflecting ongoing activity

        but less stable between pages.


        The response includes a `windowing` cursor; pass it as `windowing.next`

        on the next call to continue.'
      operationId: query_sessions_tracing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionsQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionIdsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      deprecated: true
  /tracing/users/query:
    post:
      tags:
      - Deprecated
      summary: List Users
      description: 'List distinct user IDs from span attributes.


        Returns the distinct values of `ag.user.id` across spans in the

        current project. Same pagination and `realtime` semantics as

        `POST /tracing/sessions/query`; pass the returned `windowing.next`

        cursor on subsequent calls.'
      operationId: query_users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserIdsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      deprecated: true
  /traces/ingest:
    post:
      tags:
      - Deprecated
      summary: Ingest Traces
      description: 'Ingest a batch of traces in the canonical `Traces` list shape.


        Accepts a list of trace records (each `trace_id` plus nested

        `spans`). Internally normalized into the same pipeline as

        `POST /tracing/spans/ingest`. Use this when you already hold

        data in the `Traces` list shape — for example, replaying traces

        from another environment.


        Returns `202 Accepted` with the list of accepted `trace_ids`. See

        Tracing — Async write

        contract

        for what `count` means here.'
      operationId: ingest_traces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TracesRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceIdsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      deprecated: true
  /variants/configs/fetch:
    post:
      tags:
      - Deprecated
      summary: Configs Fetch
      operationId: configs_fetch_variants_configs_fetch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_configs_fetch_variants_configs_fetch_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      deprecated: true
components:
  schemas:
    AnalyticsResponse:
      properties:
        count:
          type: integer
          title: Count
          description: Number of time buckets returned.
          default: 0
        buckets:
          items:
            $ref: '#/components/schemas/MetricsBucket'
          type: array
          title: Buckets
          description: Time-bucketed aggregates. Each bucket's `metrics` dict is keyed by the dotted `path` of the corresponding `MetricSpec`, ordered oldest to newest.
          default: []
        query:
          $ref: '#/components/schemas/TracingQuery'
          description: The resolved query used to compute the buckets.
        specs:
          items:
            $ref: '#/components/schemas/MetricSpec'
          type: array
          title: Specs
          description: The resolved metric specs applied in each bucket.
          default: []
      type: object
      title: AnalyticsResponse
      description: Analytics response with user-specified metric specs.
    Format:
      type: string
      enum:
      - agenta
      - opentelemetry
      title: Format
    ListOptions:
      properties:
        all:
          anyOf:
          - type: boolean
          - type: 'null'
          title: All
          default: false
      type: object
      title: ListOptions
    ConfigResponseModel:
      properties:
        params:
          additionalProperties: true
          type: object
          title: Params
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
        application_ref:
          anyOf:
          - $ref: '#/components/schemas/ReferenceRequestModel-Output'
          - type: 'null'
        service_ref:
          anyOf:
          - $ref: '#/components/schemas/ReferenceRequestModel-Output'
          - type: 'null'
        variant_ref:
          anyOf:
          - $ref: '#/components/schemas/ReferenceRequestModel-Output'
          - type: 'null'
        environment_ref:
          anyOf:
          - $ref: '#/components/schemas/ReferenceRequestModel-Output'
          - type: 'null'
        application_lifecycle:
          anyOf:
          - $ref: '#/components/schemas/LegacyLifecycleDTO'
          - type: 'null'
        service_lifecycle:
          anyOf:
          - $ref: '#/components/schemas/LegacyLifecycleDTO'
          - type: 'null'
        variant_lifecycle:
          anyOf:
          - $ref: '#/components/schemas/LegacyLifecycleDTO'
          - type: 'null'
        environment_lifecycle:
          anyOf:
          - $ref: '#/components/schemas/LegacyLifecycleDTO'
          - type: 'null'
      type: object
      title: ConfigResponseModel
    ReferenceRequestModel-Input:
      properties:
        slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Slug
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
        commit_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Commit Message
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Id
      type: object
      title: ReferenceRequestModel
    Windowing:
      properties:
        newest:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Newest
        oldest:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Oldest
        next:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Next
        limit:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
        order:
          anyOf:
          - type: string
            enum:
            - ascending
            - descending
          - type: 'null'
          title: Order
        interval:
          anyOf:
          - type: integer
          - type: 'null'
          title: Interval
        rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Rate
      type: object
      title: Windowing
    ReferenceRequestModel-Output:
      properties:
        slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Slug
        version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Version
        commit_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Commit Message
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Id
      type: object
      title: ReferenceRequestModel
    Condition:
      properties:
        field:
          type: string
          title: Field
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
        value:
          anyOf:
          - type: string
          - type: integer
          - type: number
          - type: boolean
          - items: {}
            type: array
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Value
        operator:
          anyOf:
          - $ref: '#/components/schemas/ComparisonOperator'
          - $ref: '#/components/schemas/NumericOperator'
          - $ref: '#/components/schemas/StringOperator'
          - $ref: '#/components/schemas/ListOperator'
          - $ref: '#/components/schemas/DictOperator'
          - $ref: '#/components/schemas/ExistenceOperator'
          - type: 'null'
          title: Operator
          default: is
        options:
          anyOf:
          - $ref: '#/components/schemas/TextOptions'
          - $ref: '#/components/schemas/ListOptions'
          - type: 'null'
          title: Options
      type: object
      required:
      - field
      title: Condition
    SpanType:
      type: string
      enum:
      - agent
      - chain
      - workflow
      - task
      - tool
      - embedding
      - query
      - llm
      - completion
      - chat
      - rerank
      - unknown
      title: SpanType
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ComparisonOperator:
      type: string
      enum:
      - is
      - is_not
      title: ComparisonOperator
    SpansTree-Output:
      properties:
        spans:
          anyOf:
          - additionalProperties:
              anyOf:
              - $ref: '#/components/schemas/SpansNode-Output'
              - items:
                  $ref: '#/components/schemas/SpansNode-Output'
                type: array
            type: object
          - type: 'null'
          title: Spans
      type: object
      title: SpansTree
    MetricType:
      type: string
      enum:
      - numeric/continuous
      - numeric/discrete
      - binary
      - categorical/single
      - categorical/multiple
      - string
      - json
      - none
      - '*'
      title: MetricType
    OTelTracingResponse:
      properties:
        count:
          type: integer
          title: Count
          description: Total number of matching traces or spans in the window.
          default: 0
        spans:
          anyOf:
          - items:
              $ref: '#/components/schemas/Span-Output'
            type: array
          - type: 'null'
          title: Spans
          description: Flat list of spans, populated when the query was run with `focus="span"`.
        traces:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/SpansTree-Output'
            type: object
          - type: 'null'
