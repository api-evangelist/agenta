openapi: 3.2.0
info:
  title: Agenta Testsets API
  description: Agenta API
  contact:
    name: Agenta
    url: https://agenta.ai/
    email: team@agenta.ai
  version: 0.1.0
servers:
- url: /api
- url: https://eu.cloud.agenta.ai/api
security:
- APIKeyHeader: []
tags:
- name: Test Sets
  description: Test datasets — collections of input/output pairs used in evaluations.
paths:
  /testsets/:
    post:
      tags:
      - Test Sets
      summary: Create Testset
      description: 'Create an empty testset artifact.


        Only creates the artifact row (name, slug, metadata). No variant or

        revision is created; add testcases by committing a revision with

        `/testsets/revisions/commit`, or use `/simple/testsets/` to create

        a testset with seed rows in a single call.'
      operationId: create_testset
      parameters:
      - name: testset_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Testset Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestsetCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /testsets/{testset_id}:
    get:
      tags:
      - Test Sets
      summary: Fetch Testset
      description: 'Fetch a testset artifact by ID.


        Returns the artifact row only; testcases are stored on revisions and

        must be fetched via `/testsets/revisions/retrieve` or

        `/testcases/query`.'
      operationId: fetch_testset
      parameters:
      - name: testset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Testset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Test Sets
      summary: Edit Testset
      description: 'Update metadata on a testset artifact.


        Only artifact-level fields (name, description, slug, flags, tags,

        meta, folder) are editable here. Testcase changes are committed as

        new revisions via `/testsets/revisions/commit`.'
      operationId: edit_testset
      parameters:
      - name: testset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Testset Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestsetEditRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /testsets/{testset_id}/archive:
    post:
      tags:
      - Test Sets
      summary: Archive Testset
      description: 'Soft-delete a testset artifact.


        Sets `deleted_at` on the testset. Archived testsets are excluded

        from `/testsets/query` unless `include_archived` is true. Use

        `/testsets/{testset_id}/unarchive` to restore.'
      operationId: archive_testset
      parameters:
      - name: testset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Testset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /testsets/{testset_id}/unarchive:
    post:
      tags:
      - Test Sets
      summary: Unarchive Testset
      description: 'Restore a previously archived testset artifact.


        Clears `deleted_at` on the testset so it shows up in queries again.'
      operationId: unarchive_testset
      parameters:
      - name: testset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Testset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /testsets/query:
    post:
      tags:
      - Test Sets
      summary: Query Testsets
      description: 'List and filter testset artifacts.


        Follows the shared query pattern: attribute filters on the testset

        body, optional `testset_refs` to restrict by id/slug, cursor-based

        pagination via `windowing`. Only artifact rows are returned — no

        testcases. See the Query Pattern guide for the full body shape.'
      operationId: query_testsets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestsetQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /testsets/variants/:
    post:
      tags:
      - Test Sets
      summary: Create Testset Variant
      description: 'Create a variant (history branch) on a testset.


        Most testsets only need one variant. Create additional variants to

        maintain parallel revision histories (for example, a staging branch

        separate from the main one).'
      operationId: create_testset_variant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestsetVariantCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /testsets/variants/{testset_variant_id}:
    get:
      tags:
      - Test Sets
      summary: Fetch Testset Variant
      description: 'Fetch a variant by ID.


        Returns the variant row (branch metadata). Use

        `/testsets/revisions/retrieve` to get the latest revision on this

        variant.'
      operationId: fetch_testset_variant
      parameters:
      - name: testset_variant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Testset Variant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Test Sets
      summary: Edit Testset Variant
      description: 'Update metadata on a testset variant.


        Variants hold only branch-level metadata (name, description, slug,

        flags, tags, meta). Testcase content belongs to revisions.'
      operationId: edit_testset_variant
      parameters:
      - name: testset_variant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Testset Variant Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestsetVariantEditRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /testsets/variants/{testset_variant_id}/archive:
    post:
      tags:
      - Test Sets
      summary: Archive Testset Variant
      description: 'Soft-delete a testset variant.


        Archiving a variant excludes it from `/testsets/variants/query`

        unless `include_archived` is true. Its revisions stay in place and

        can still be retrieved by ID.'
      operationId: archive_testset_variant
      parameters:
      - name: testset_variant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Testset Variant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /testsets/variants/{testset_variant_id}/unarchive:
    post:
      tags:
      - Test Sets
      summary: Unarchive Testset Variant
      description: Restore a previously archived testset variant.
      operationId: unarchive_testset_variant
      parameters:
      - name: testset_variant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Testset Variant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /testsets/variants/query:
    post:
      tags:
      - Test Sets
      summary: Query Testset Variants
      description: 'List and filter testset variants.


        Use `testset_refs` to scope to one or more parent testsets. Use

        `testset_variant_refs` to restrict by specific variant id/slug.'
      operationId: query_testset_variants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestsetVariantQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetVariantsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /testsets/variants/fork:
    post:
      tags:
      - Test Sets
      summary: Fork Testset Variant
      description: 'Fork an existing testset variant into a new variant.


        The new variant starts from the source variant''s head revision (or a

        pinned revision if `testset_revision_ref` is provided). Provide `slug`

        and `name` in the fork body to identify the new variant.'
      operationId: fork_testset_variant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestsetVariantForkRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /testsets/revisions/:
    post:
      tags:
      - Test Sets
      summary: Create Testset Revision
      description: 'Create and commit the initial revision for a testset variant.


        Most callers instead use `/testsets/revisions/commit`, which writes

        the testcases and the revision together. This endpoint commits an

        initial revision with the `initial` guard, preventing duplicate

        initial revisions for the same variant.'
      operationId: create_testset_revision
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestsetRevisionCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /testsets/revisions/{testset_revision_id}:
    get:
      tags:
      - Test Sets
      summary: Fetch Testset Revision
      operationId: fetch_testset_revision
      parameters:
      - name: testset_revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Testset Revision Id
      - name: include_testcases
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: 'Include full testcase objects. Default (null/true): include testcases. False: return only testcase IDs.'
          title: Include Testcases
        description: 'Include full testcase objects. Default (null/true): include testcases. False: return only testcase IDs.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Test Sets
      summary: Edit Testset Revision
      operationId: edit_testset_revision
      parameters:
      - name: testset_revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Testset Revision Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestsetRevisionEditRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /testsets/revisions/{testset_revision_id}/archive:
    post:
      tags:
      - Test Sets
      summary: Archive Testset Revision
      operationId: archive_testset_revision
      parameters:
      - name: testset_revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Testset Revision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /testsets/revisions/{testset_revision_id}/unarchive:
    post:
      tags:
      - Test Sets
      summary: Unarchive Testset Revision
      operationId: unarchive_testset_revision
      parameters:
      - name: testset_revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Testset Revision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /testsets/revisions/{testset_revision_id}/download:
    post:
      tags:
      - Test Sets
      summary: Fetch Testset Revision To File
      operationId: fetch_testset_revision_to_file
      parameters:
      - name: testset_revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Testset Revision Id
      - name: file_type
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - csv
            - json
            type: string
          - type: 'null'
          description: 'File type to download. Supported: ''csv'' or ''json''. Default: ''csv''.'
          default: csv
          title: File Type
        description: 'File type to download. Supported: ''csv'' or ''json''. Default: ''csv''.'
      - name: file_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional custom filename for the download.
          title: File Name
        description: Optional custom filename for the download.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /testsets/revisions/{testset_revision_id}/upload:
    post:
      tags:
      - Test Sets
      summary: Create Testset Revision From File
      operationId: create_testset_revision_from_file
      parameters:
      - name: testset_revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Testset Revision Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_testset_revision_from_file'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /testsets/revisions/query:
    post:
      tags:
      - Test Sets
      summary: Query Testset Revisions
      operationId: query_testset_revisions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestsetRevisionQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetRevisionsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /testsets/revisions/commit:
    post:
      tags:
      - Test Sets
      summary: Commit Testset Revision
      operationId: commit_testset_revision
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestsetRevisionCommitRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /testsets/revisions/retrieve:
    post:
      tags:
      - Test Sets
      summary: Retrieve Testset Revision
      operationId: retrieve_testset_revision
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestsetRevisionRetrieveRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /testsets/revisions/log:
    post:
      tags:
      - Test Sets
      summary: Log Testset Revisions
      operationId: log_testset_revisions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestsetRevisionsLogRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsetRevisionsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simple/testsets/:
    post:
      tags:
      - Test Sets
      summary: Create Simple Testset
      operationId: create_simple_testset
      parameters:
      - name: testset_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Testset Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimpleTestsetCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleTestsetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simple/testsets/{testset_id}:
    get:
      tags:
      - Test Sets
      summary: Fetch Simple Testset
      operationId: fetch_simple_testset
      parameters:
      - name: testset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Testset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleTestsetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Test Sets
      summary: Edit Simple Testset
      operationId: edit_simple_testset
      parameters:
      - name: testset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Testset Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimpleTestsetEditRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleTestsetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simple/testsets/{testset_id}/archive:
    post:
      tags:
      - Test Sets
      summary: Archive Simple Testset
      operationId: archive_simple_testset
      parameters:
      - name: testset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Testset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleTestsetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simple/testsets/{testset_id}/unarchive:
    post:
      tags:
      - Test Sets
      summary: Unarchive Simple Testset
      operationId: unarchive_simple_testset
      parameters:
      - name: testset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Testset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleTestsetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simple/testsets/{testset_id}/upload:
    post:
      tags:
      - Test Sets
      summary: Edit Simple Testset From File
      operationId: edit_simple_testset_from_file
      parameters:
      - name: testset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Testset Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_edit_simple_testset_from_file'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleTestsetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simple/testsets/{testset_id}/download:
    post:
      tags:
      - Test Sets
      summary: Fetch Simple Testset To File
      operationId: fetch_simple_testset_to_file
      parameters:
      - name: testset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Testset Id
      - name: file_type
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - csv
            - json
            type: string
          - type: 'null'
          title: File Type
      - name: file_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: File Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
