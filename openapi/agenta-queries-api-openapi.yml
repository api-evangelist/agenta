      tags:
      - Queries
      summary: Archive Query Variant
      operationId: archive_query_variant
      parameters:
      - name: query_variant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Query Variant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /queries/variants/{query_variant_id}/unarchive:
    post:
      tags:
      - Queries
      summary: Unarchive Query Variant
      operationId: unarchive_query_variant
      parameters:
      - name: query_variant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Query Variant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /queries/variants/query:
    post:
      tags:
      - Queries
      summary: Query Query Variants
      operationId: query_query_variants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryVariantQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryVariantsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /queries/variants/fork:
    post:
      tags:
      - Queries
      summary: Fork Query Variant
      description: 'Fork an existing query variant into a new variant.


        The new variant starts from the source variant''s head revision (or a

        pinned revision if `query_revision_ref` is provided). Provide `slug`

        and `name` in the fork body to identify the new variant.'
      operationId: fork_query_variant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryVariantForkRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /queries/revisions/retrieve:
