components:
  schemas:
    Format:
      type: string
      enum:
      - agenta
      - opentelemetry
      title: Format
    ListOptions:
      properties:
        all:
          anyOf:
          - type: boolean
          - type: 'null'
          title: All
          default: false
      type: object
      title: ListOptions
    QueryVariantEditRequest:
      properties:
        query_variant:
          $ref: '#/components/schemas/QueryVariantEdit'
      type: object
      required:
      - query_variant
      title: QueryVariantEditRequest
    SimpleQueryEditRequest:
      properties:
        query:
          $ref: '#/components/schemas/SimpleQueryEdit'
      type: object
      required:
      - query
      title: SimpleQueryEditRequest
    QueryRevisionRetrieveRequest:
      properties:
        query_ref:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
          description: Query artifact to look up. Identifies the artifact by `id` or `slug` (both project-unique). When no variant_ref or revision_ref is provided, returns the latest revision of an arbitrary variant of this query.
        query_variant_ref:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
          description: Query variant to look up. Identifies the variant by `id` or `slug` (both project-unique). When no revision_ref is provided, returns the latest revision of this variant.
        query_revision_ref:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
          description: Query revision to look up. `id` alone identifies a revision (project-unique). `slug` alone identifies a revision (project-unique). `version` alone is a per-variant sequence number and is **not** sufficient on its own; it must be combined with a `query_variant_ref`. Sending only `version` without a variant ref returns HTTP 400.
        include_trace_ids:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Include Trace Ids
        include_traces:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Include Traces
        windowing:
          anyOf:
          - $ref: '#/components/schemas/Windowing'
          - type: 'null'
      type: object
      title: QueryRevisionRetrieveRequest
    QueryRevisionsLogRequest:
      properties:
        query_revisions:
          $ref: '#/components/schemas/QueryRevisionsLog'
      type: object
      required:
      - query_revisions
      title: QueryRevisionsLogRequest
    SpanType:
      type: string
      enum:
      - agent
      - chain
      - workflow
      - task
      - tool
      - embedding
      - query
      - llm
      - completion
      - chat
      - rerank
      - unknown
      title: SpanType
    QueryCreate:
      properties:
        folder_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Folder Id
        flags:
          anyOf:
          - $ref: '#/components/schemas/QueryFlags'
          - type: 'null'
        tags:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/LabelJson-Input'
            type: object
          - type: 'null'
          title: Tags
        meta:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/FullJson-Input'
            type: object
          - type: 'null'
          title: Meta
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Slug
      type: object
      title: QueryCreate
    QueryRevisionResponse:
      properties:
        count:
          type: integer
          title: Count
          default: 0
        query_revision:
          anyOf:
          - $ref: '#/components/schemas/QueryRevision'
          - type: 'null'
        retrieval_info:
          anyOf:
          - $ref: '#/components/schemas/RetrievalInfo'
          - type: 'null'
      type: object
      title: QueryRevisionResponse
    QueryVariantResponse:
