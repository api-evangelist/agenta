          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
