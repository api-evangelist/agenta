      summary: Archive Simple Query
      operationId: archive_simple_query
      parameters:
      - name: query_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Query Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleQueryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simple/queries/{query_id}/unarchive:
    post:
      tags:
      - Queries
      summary: Unarchive Simple Query
      operationId: unarchive_simple_query
      parameters:
      - name: query_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Query Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleQueryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simple/queries/query:
    post:
      tags:
      - Queries
      summary: Query Simple Queries
      operationId: query_simple_queries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimpleQueryQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleQueriesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
