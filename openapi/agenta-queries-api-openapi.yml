  /simple/queries/:
    post:
      tags:
      - Queries
      summary: Create Simple Query
      operationId: create_simple_query
      parameters:
      - name: query_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
