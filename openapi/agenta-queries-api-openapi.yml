      operationId: edit_query_revision
      parameters:
      - name: query_revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Query Revision Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRevisionEditRequest'
      responses:
        '200':
          description: Successful Response
          content:
