      summary: Edit Query Variant
      operationId: edit_query_variant
      parameters:
      - name: query_variant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Query Variant Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryVariantEditRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryVariantResponse'
        '422':
