  /channels/catalog/channels/{channel}/capabilities/:
    get:
      tags:
      - Channels
      summary: Fetch Channel Capabilities
      operationId: fetch_channel_capabilities
      parameters:
      - name: channel
        in: path
        required: true
        schema:
          type: string
          title: Channel
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelCapabilitiesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /channels/catalog/channels/{channel}/setup/:
    get:
      tags:
      - Channels
      summary: Fetch Channel Setup
      description: 'Reachable before any connection exists -- the manifest an

        operator needs to go build the platform app in the first place.

        `fetch_channel_connection_setup` stays the route for a connection

        that already exists; this is the one that precedes it.


        `name`, `description` and `handle` are how the app the operator

        builds presents itself; the adapter defaults and fits each one.'
      operationId: fetch_channel_setup
      parameters:
      - name: channel
        in: path
        required: true
        schema:
          type: string
          title: Channel
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      - name: description
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      - name: handle
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Handle
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelSetupResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /channels/catalog/channels/slack/install/:
    get:
      tags:
      - Channels
      summary: Install Slack Connection
      description: 'One click, from Settings -> Channels: mint the install state and

        send the browser straight to Slack''s authorize URL. A deployment

        with no hosted-app credentials refuses here, not with a 500 -- that

        is the normal shape of a self-hosted deployment, not an error.'
      operationId: install_slack_connection
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /channels/catalog/channels/slack/callback/:
    get:
      tags:
      - Channels
      summary: Slack Install Callback
      description: 'Slack redirects the browser here, in or out of the session that

        started the install -- the signed state is the whole of the

        authorisation on this route, so this is public (see

        `_PUBLIC_ENDPOINTS`), never `self._check`. State decodes first:

        unknown, expired or tampered refuses before any exchange is

        attempted.'
      operationId: slack_install_callback
      parameters:
      - name: code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Code
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: State
      - name: error
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /channels/catalog/channels/telegram_hosted/bind-link/:
    post:
