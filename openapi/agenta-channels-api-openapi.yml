  /channels/catalog/channels/telegram_hosted/bindings/:
    get:
      tags:
      - Channels
      summary: List Telegram Hosted Bindings
      description: 'The chats bound to a hosted Telegram connection in this project.

        Empty until a /start consumed a bind token. 404 when the deployment has

