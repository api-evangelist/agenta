openapi: 3.2.0
info:
  title: Agenta Channels API
  description: Agenta API
  contact:
    name: Agenta
    url: https://agenta.ai/
    email: team@agenta.ai
  version: 0.1.0
servers:
- url: /api
- url: https://eu.cloud.agenta.ai/api
security:
- APIKeyHeader: []
tags:
- name: Channels
  description: Chat platform channels — connections, agents, spaces, grants, and the inbound event log.
paths:
  /channels/slack/events/:
    post:
      tags:
      - Channels
      summary: Ingest Slack Event
      operationId: ingest_slack_event
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelEventAck'
  /channels/telegram/events/{routing_token}/:
    post:
      tags:
      - Channels
      summary: Ingest Telegram Event
      operationId: ingest_telegram_event
      parameters:
      - name: routing_token
        in: path
        required: true
        schema:
          type: string
          title: Routing Token
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelEventAck'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /channels/whatsapp/events/:
    get:
      tags:
      - Channels
      summary: Verify Whatsapp Webhook
      description: 'Meta''s subscription check: echo `hub.challenge` as plain text when

        `hub.verify_token` is the token a WhatsApp connection handed its

        operator. The token starts with the phone number ID, which picks the

        one connection to compare against. Echoing grants nothing, but an

        unknown token is refused so the URL answers only for its own numbers.'
      operationId: verify_whatsapp_webhook
      responses:
        '200':
          description: Successful Response
          content:
            text/plain:
              schema:
                type: string
    post:
      tags:
      - Channels
      summary: Ingest Whatsapp Event
      operationId: ingest_whatsapp_event
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelEventAck'
  /channels/bridge/events/:
    post:
      tags:
      - Channels
      summary: Ingest Bridge Event
      operationId: ingest_bridge_event
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelEventAck'
  /channels/agenta/events/:
    post:
      tags:
      - Channels
      summary: Ingest Agenta Event
      operationId: ingest_agenta_event
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelEventAck'
  /channels/catalog/channels/:
    get:
      tags:
      - Channels
      summary: List Channels
      operationId: list_channels
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
