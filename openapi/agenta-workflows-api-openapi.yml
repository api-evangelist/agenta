        workflow_variant_ref:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
          description: Workflow variant to look up. Identifies the variant by `id` or `slug` (both project-unique). When no revision_ref is provided, returns the latest revision of this variant.
