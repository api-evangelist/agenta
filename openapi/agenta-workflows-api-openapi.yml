          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
          description: Environment artifact backing the deployment to resolve from.
        environment_variant_ref:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
          description: Environment variant backing the deployment to resolve from.
        environment_revision_ref:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
          description: Specific environment revision to resolve from.
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
          description: Key into the environment revision's reference map. Required when retrieving via environment refs.
        resolve:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Resolve
          description: When true, resolve `@ag.references` tokens embedded in the revision configuration before returning it.
        include_archived:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Include Archived
          description: When false, an archived workflow, variant, or revision resolves to nothing.
