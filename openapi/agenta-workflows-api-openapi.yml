openapi: 3.2.0
info:
  title: Agenta Workflows API
  description: Agenta API
  contact:
    name: Agenta
    url: https://agenta.ai/
    email: team@agenta.ai
  version: 0.1.0
servers:
- url: /api
- url: https://eu.cloud.agenta.ai/api
security:
- APIKeyHeader: []
tags:
- name: Workflows
  description: Workflow definitions — the runnable pipelines that back an application.
paths:
  /workflows/catalog/types/:
    get:
      tags:
      - Workflows
      summary: List Workflow Catalog Types
      description: 'List the shared JSON Schema fragments available to workflow schemas.


        Workflow input/output schemas reference these via `x-ag-type-ref` (for

        example, `message` or `prompt`). Use this endpoint to discover what

        type keys exist before building a schema.


        See: Workflows.'
      operationId: list_workflow_catalog_types
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowCatalogTypesResponse'
  /workflows/catalog/types/{ag_type}:
    get:
      tags:
      - Workflows
      summary: Fetch Workflow Catalog Type
      description: 'Return the JSON Schema for a single shared type key.


        Returns 404 when the `ag_type` is not part of the shipped catalog.


        See: Workflows.'
      operationId: fetch_workflow_catalog_type
      parameters:
      - name: ag_type
        in: path
        required: true
        schema:
          type: string
          title: Ag Type
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowCatalogTypeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workflows/catalog/harnesses/:
    get:
      tags:
      - Workflows
      summary: List Workflow Catalog Harnesses
      description: 'List the agent harness records shipped with the product.


        Each record carries the harness `capabilities` (providers, deployments, connection

        modes, model selection, models). A workflow''s harness field references one via

        `x-ag-harness-ref`, resolved against `/catalog/harnesses/{ag_harness}`.


        See: Workflows.'
      operationId: list_workflow_catalog_harnesses
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowCatalogHarnessesResponse'
  /workflows/catalog/harnesses/{ag_harness}:
    get:
      tags:
      - Workflows
      summary: Fetch Workflow Catalog Harness
      description: 'Return a single harness record (with its `capabilities`).


        Returns 404 when the `ag_harness` is not part of the shipped catalog.


        See: Workflows.'
      operationId: fetch_workflow_catalog_harness
      parameters:
      - name: ag_harness
        in: path
        required: true
        schema:
          type: string
          title: Ag Harness
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowCatalogHarnessResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workflows/catalog/templates/:
    get:
      tags:
      - Workflows
      summary: List Workflow Catalog Templates
      description: 'List workflow blueprints shipped with the product.


        Filter by domain with `is_application`, `is_evaluator`, or

        `is_snippet`. Archived templates are hidden unless `include_archived`

        is true. Templates are global and read-only.


        See: Workflows.'
      operationId: list_workflow_catalog_templates
      parameters:
      - name: include_archived
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Include Archived
      - name: is_application
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Application
      - name: is_evaluator
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Evaluator
      - name: is_snippet
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Snippet
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowCatalogTemplatesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workflows/catalog/templates/{template_key}:
    get:
      tags:
      - Workflows
      summary: Fetch Workflow Catalog Template
      description: 'Return a single workflow template by its key.


        Returns `count=0` when the template is not found. Templates are global

        metadata and are not scoped to a project.


        See: Workflows.'
      operationId: fetch_workflow_catalog_template
      parameters:
      - name: template_key
        in: path
        required: true
        schema:
          type: string
          title: Template Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowCatalogTemplateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workflows/catalog/templates/{template_key}/presets/:
    get:
      tags:
      - Workflows
      summary: List Workflow Catalog Presets
      description: 'List presets defined against a template.


        Presets are named parameter sets that can be committed as the first

        revision of a new variant. Returns an empty list when a template has

        no canned presets.


        See: Workflows.'
      operationId: list_workflow_catalog_presets
      parameters:
      - name: template_key
        in: path
        required: true
        schema:
          type: string
          title: Template Key
      - name: include_archived
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Include Archived
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowCatalogPresetsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workflows/catalog/templates/{template_key}/presets/{preset_key}:
    get:
      tags:
      - Workflows
      summary: Fetch Workflow Catalog Preset
      description: 'Return a single preset for a template by key.


        Returns `count=0` when the preset is not defined.


        See: Workflows.'
      operationId: fetch_workflow_catalog_preset
      parameters:
      - name: template_key
        in: path
        required: true
        schema:
          type: string
          title: Template Key
      - name: preset_key
        in: path
        required: true
        schema:
          type: string
          title: Preset Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowCatalogPresetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workflows/:
    post:
      tags:
      - Workflows
      summary: Create Workflow
      description: 'Create a workflow artifact.


        Creates the top-level container only; commit a revision on a variant

        before the workflow can be retrieved or invoked. Use when you need the

        lower-level primitive — pick `/applications/` for serving logic or

        `/evaluators/` for scoring logic.


        See: Workflows,

        Versioning.'
      operationId: create_workflow
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workflows/{workflow_id}:
    get:
      tags:
      - Workflows
      summary: Fetch Workflow
      description: 'Fetch a workflow artifact by ID.


        Returns the artifact only — variants and revisions are not included.

        Use `/workflows/variants/query` and `/workflows/revisions/query` for

        the child entities.


        See: Workflows.'
      operationId: fetch_workflow
      parameters:
      - name: workflow_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workflow Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Workflows
      summary: Edit Workflow
      description: 'Update artifact-level fields on a workflow.


        The `id` in the body must match the path parameter. Only supplied

        fields are modified. Configuration (parameters, URL, schemas) lives on

        revisions — commit a new revision to change those.


        See: Workflows,

        Versioning.'
      operationId: edit_workflow
      parameters:
      - name: workflow_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workflow Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowEditRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workflows/{workflow_id}/archive:
    post:
      tags:
      - Workflows
      summary: Archive Workflow
      description: 'Archive a workflow artifact (soft delete).


        Sets `deleted_at` on the workflow and its variants. Archived

        workflows are hidden from queries unless `include_archived=true`.

        Revision IDs remain resolvable so historical traces stay intact.


        See: Versioning.'
      operationId: archive_workflow
      parameters:
      - name: workflow_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workflow Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workflows/{workflow_id}/unarchive:
    post:
      tags:
      - Workflows
      summary: Unarchive Workflow
      description: 'Restore a previously archived workflow.


        Clears `deleted_at` on the workflow. Archived variants and revisions

        are restored with the workflow.


        See: Versioning.'
      operationId: unarchive_workflow
      parameters:
      - name: workflow_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workflow Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workflows/query:
    post:
      tags:
      - Workflows
      summary: Query Workflows
      description: 'Query workflow artifacts with filters and pagination.


        Accepts the same filters as query parameters or in the request body;

        body fields win when both are supplied. Results are ordered by

        creation time; pass `windowing.next` back for the following page.


        See: Query Pattern.'
      operationId: query_workflows
      parameters:
      - name: workflow_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Workflow Id
      - name: workflow_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          title: Workflow Ids
      - name: workflow_slug
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Workflow Slug
      - name: workflow_slugs
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Workflow Slugs
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      - name: description
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      - name: flags
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Flags
      - name: tags
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tags
      - name: meta
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Meta
      - name: include_archived
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Include Archived
      - name: next
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Next
      - name: newest
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Newest
      - name: oldest
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Oldest
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
      - name: order
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - ascending
            - descending
            type: string
          - type: 'null'
          title: Order
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workflows/variants/:
    post:
      tags:
      - Workflows
      summary: Create Workflow Variant
      description: 'Create a new variant under an existing workflow.


        Variants are branches of an artifact''s history; each maintains its own

        revision log. Variant slugs are unique within the project — reuse of a

        slug already in use returns a 409 conflict.


        See: Versioning.'
      operationId: create_workflow_variant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowVariantCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workflows/variants/{workflow_variant_id}:
    get:
      tags:
      - Workflows
      summary: Fetch Workflow Variant
      description: 'Fetch a workflow variant by ID.


        Returns the variant metadata only — use

        `/workflows/revisions/retrieve` or `/workflows/revisions/log` for the

        variant''s revisions.


        See: Workflows.'
      operationId: fetch_workflow_variant
      parameters:
      - name: workflow_variant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workflow Variant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Workflows
      summary: Edit Workflow Variant
      description: 'Update metadata on a workflow variant.


        The `id` in the body must match the path parameter. Revisions on the

        variant are not affected — commit a new revision to change data.


        See: Versioning.'
      operationId: edit_workflow_variant
      parameters:
      - name: workflow_variant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workflow Variant Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowVariantEditRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workflows/variants/{workflow_variant_id}/archive:
    post:
      tags:
      - Workflows
      summary: Archive Workflow Variant
      description: 'Archive a workflow variant.


        Soft-deletes the variant and its revisions. Archived variants are

        hidden from queries unless `include_archived=true`. See

        Versioning.'
      operationId: archive_workflow_variant
      parameters:
      - name: workflow_variant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workflow Variant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workflows/variants/{workflow_variant_id}/unarchive:
    post:
      tags:
      - Workflows
      summary: Unarchive Workflow Variant
      description: 'Restore a previously archived workflow variant.


        Clears `deleted_at` on the variant and its revisions. See

        Versioning.'
      operationId: unarchive_workflow_variant
      parameters:
      - name: workflow_variant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workflow Variant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workflows/variants/query:
    post:
      tags:
      - Workflows
      summary: Query Workflow Variants
      description: 'Query workflow variants with filters and pagination.


        Scope the query by `workflow_refs` (parent artifact) or

        `workflow_variant_refs` (specific variants). Accepts the same fields

        as query parameters or in the request body.


        See: Query Pattern.'
      operationId: query_workflow_variants
      parameters:
      - name: workflow_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Workflow Id
      - name: workflow_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          title: Workflow Ids
      - name: workflow_slug
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Workflow Slug
      - name: workflow_slugs
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Workflow Slugs
      - name: workflow_variant_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Workflow Variant Id
      - name: workflow_variant_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          title: Workflow Variant Ids
      - name: workflow_variant_slug
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Workflow Variant Slug
      - name: workflow_variant_slugs
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Workflow Variant Slugs
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      - name: description
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      - name: flags
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Flags
      - name: tags
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tags
      - name: meta
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Meta
      - name: include_archived
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Include Archived
      - name: next
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Next
      - name: newest
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Newest
      - name: oldest
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Oldest
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
      - name: order
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - ascending
            - descending
            type: string
          - type: 'null'
          title: Order
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVariantsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workflows/variants/fork:
    post:
      tags:
      - Workflows
      summary: Fork Workflow Variant
      operationId: fork_workflow_variant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowVariantForkRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workflows/revisions/retrieve:
    post:
      tags:
      - Workflows
      summary: Retrieve Workflow Revision
      operationId: retrieve_workflow_revision
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRevisionRetrieveRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workflows/revisions/deploy:
    post:
      tags:
      - Workflows
      summary: Deploy Workflow Revision
      operationId: deploy_workflow_revision
      requestBody:
        content:
          application/json:
