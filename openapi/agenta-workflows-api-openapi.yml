components:
  schemas:
    WorkflowVariantForkRequest:
      properties:
        workflow_variant:
          $ref: '#/components/schemas/WorkflowVariantFork'
          description: Config for the new variant (slug, name, description, flags).
        workflow_variant_ref:
          $ref: '#/components/schemas/Reference'
          description: Source variant to fork from.
        workflow_revision_ref:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
          description: Pin the fork to this revision; defaults to the source variant's head.
      type: object
      required:
      - workflow_variant
      - workflow_variant_ref
      title: WorkflowVariantForkRequest
    WorkflowRevisionsResponse:
      properties:
        count:
          type: integer
          title: Count
          description: Number of revisions in this page.
          default: 0
        workflow_revisions:
          items:
            $ref: '#/components/schemas/WorkflowRevision-Output'
          type: array
          title: Workflow Revisions
          description: Workflow revisions matching the query, ordered by commit time.
        windowing:
          anyOf:
          - $ref: '#/components/schemas/Windowing'
          - type: 'null'
          description: Pagination cursor.
      type: object
      title: WorkflowRevisionsResponse
    WorkflowRevisionsLogRequest:
      properties:
        workflow_revisions:
          $ref: '#/components/schemas/WorkflowRevisionsLog'
          description: Log query. Supply `workflow_id`, `workflow_variant_id`, or `workflow_revision_id` to scope the log, and an optional `depth`.
      type: object
      required:
      - workflow_revisions
      title: WorkflowRevisionsLogRequest
    WorkflowCatalogPresetResponse:
      properties:
        count:
          type: integer
          title: Count
          description: '`1` when the preset is returned, `0` when not found.'
          default: 0
        preset:
          anyOf:
          - $ref: '#/components/schemas/WorkflowCatalogPreset'
          - type: 'null'
          description: Named parameter set defined against a template.
      type: object
      title: WorkflowCatalogPresetResponse
    CatalogAuthor:
      properties:
        schema_version:
          type: integer
          const: 1
          title: Schema Version
        id:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title: Id
        name:
          type: string
          maxLength: 128
          minLength: 1
          title: Name
        bio:
          type: string
          maxLength: 2000
          minLength: 1
          title: Bio
        avatar_url:
          anyOf:
          - type: string
            maxLength: 2048
            pattern: ^(https://\S+|media(/[A-Za-z0-9_-][A-Za-z0-9._-]*)+)$
          - type: 'null'
          title: Avatar Url
        links:
          items:
            $ref: '#/components/schemas/CatalogAuthorLink'
          type: array
          title: Links
      additionalProperties: false
      type: object
      required:
      - schema_version
      - id
      - name
      - bio
      title: CatalogAuthor
    SessionFileTemplateSource:
      properties:
        kind:
          type: string
          const: session_file
          title: Kind
          default: session_file
        session_id:
          type: string
          maxLength: 256
          minLength: 1
          title: Session Id
        path:
          type: string
          maxLength: 1024
          minLength: 1
          title: Path
        pin:
          anyOf:
          - $ref: '#/components/schemas/TemplateSourcePin'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - session_id
      - path
      title: SessionFileTemplateSource
      description: 'A zip in a session''s working directory, such as one an agent wrote in chat.


        The file is mutable, so load requires the pin that validation returned and

        rejects bytes that no longer match it.'
    WorkflowCatalogTypesResponse:
      properties:
        count:
          type: integer
          title: Count
          description: Number of type definitions available.
          default: 0
        types:
          items:
            $ref: '#/components/schemas/WorkflowCatalogType'
          type: array
          title: Types
          description: Shared JSON Schema fragments shipped with the product.
      type: object
      title: WorkflowCatalogTypesResponse
    WorkflowVariantFork:
      properties:
        flags:
          anyOf:
          - $ref: '#/components/schemas/WorkflowVariantFlags'
          - type: 'null'
        tags:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/LabelJson-Input'
            type: object
          - type: 'null'
          title: Tags
        meta:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/FullJson-Input'
            type: object
          - type: 'null'
          title: Meta
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Slug
      type: object
      title: WorkflowVariantFork
    WorkflowVariantResponse:
      properties:
        count:
          type: integer
          title: Count
          description: '`1` when a variant is returned, `0` when none matched.'
          default: 0
        workflow_variant:
          anyOf:
          - $ref: '#/components/schemas/WorkflowVariant'
          - type: 'null'
          description: The workflow variant.
      type: object
      title: WorkflowVariantResponse
    TemplatesResponse:
      properties:
        count:
          type: integer
          title: Count
        templates:
          items:
            $ref: '#/components/schemas/AgentTemplateEntry'
          type: array
          title: Templates
      type: object
      required:
      - count
      - templates
