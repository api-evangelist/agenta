openapi: 3.2.0
info:
  title: Agenta Secrets API
  description: Agenta API
  contact:
    name: Agenta
    url: https://agenta.ai/
    email: team@agenta.ai
  version: 0.1.0
servers:
- url: /api
- url: https://eu.cloud.agenta.ai/api
security:
- APIKeyHeader: []
tags:
- name: Secrets
  description: Manage provider credentials and secret values stored in the vault.
paths:
  /secrets/:
    get:
      tags:
      - Secrets
      summary: List Secrets
      operationId: list_secrets
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PublicSecretResponseDTO'
                type: array
                title: Response List Secrets
    post:
      tags:
      - Secrets
      summary: Create Secret
      operationId: create_secret
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecretDTO'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSecretResponseDTO'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /secrets/{secret_id_or_slug}:
    get:
      tags:
      - Secrets
      summary: Read Secret
      operationId: read_secret
      parameters:
      - name: secret_id_or_slug
        in: path
        required: true
        schema:
          type: string
          title: Secret Id Or Slug
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSecretResponseDTO'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /secrets/{secret_id}:
    put:
      tags:
      - Secrets
      summary: Update Secret
      operationId: update_secret
      parameters:
      - name: secret_id
        in: path
        required: true
        schema:
          type: string
          title: Secret Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSecretDTO'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSecretResponseDTO'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Secrets
      summary: Delete Secret
      operationId: delete_secret
      parameters:
      - name: secret_id
        in: path
        required: true
        schema:
          type: string
          title: Secret Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /secrets/{secret_id}/login-attempts:
    post:
      tags:
      - Secrets
      summary: Start Subscription Login
      operationId: start_subscription_login
      parameters:
      - name: secret_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Secret Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionLoginAttemptResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /secrets/{secret_id}/login-attempts/{attempt_id}:
    get:
      tags:
      - Secrets
      summary: Read Subscription Login
      operationId: read_subscription_login
      parameters:
      - name: secret_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Secret Id
      - name: attempt_id
        in: path
        required: true
        schema:
          type: string
          title: Attempt Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionLoginAttemptResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /secrets/{secret_id}/login-attempts/{attempt_id}/cancel:
    post:
      tags:
      - Secrets
      summary: Cancel Subscription Login
      operationId: cancel_subscription_login
      parameters:
      - name: secret_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Secret Id
      - name: attempt_id
        in: path
        required: true
        schema:
          type: string
          title: Attempt Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionLoginAttemptResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /secrets/{secret_id}/subscription-login:
    post:
      tags:
      - Secrets
      summary: Push Subscription Login
      operationId: push_subscription_login
      parameters:
      - name: secret_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Secret Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionLoginPushRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionLoginPushResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /secrets/{secret_id}/subscription-login/failure:
    post:
      tags:
      - Secrets
      summary: Report Subscription Login Failure
      operationId: report_subscription_login_failure
      parameters:
      - name: secret_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Secret Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionLoginFailureRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionLoginFailureResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /providers/probe:
    post:
      tags:
      - Secrets
      summary: Probe Provider
      operationId: probe_provider
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProbeProviderRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeProviderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    OAuthProviderDTO:
      properties:
        provider:
          $ref: '#/components/schemas/OAuthProviderSettingsDTO'
      type: object
      required:
      - provider
      title: OAuthProviderDTO
    UpdateSecretDTO:
      properties:
        header:
          anyOf:
          - $ref: '#/components/schemas/Header'
          - type: 'null'
        secret:
          anyOf:
          - $ref: '#/components/schemas/UpdateSecretPayloadDTO'
          - type: 'null'
      additionalProperties: false
      type: object
      title: UpdateSecretDTO
    CustomSecretFormat:
      type: string
      enum:
      - text
      - json
      title: CustomSecretFormat
    ProbeProviderResponse:
      properties:
        credential:
          $ref: '#/components/schemas/CredentialResult'
        discovery:
          $ref: '#/components/schemas/DiscoveryResult'
        fetched_at:
          type: string
          format: date-time
          title: Fetched At
      type: object
      required:
      - credential
      - discovery
      - fetched_at
      title: ProbeProviderResponse
    CustomProviderSettingsDTO:
      properties:
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
        extras:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Extras
      type: object
      title: CustomProviderSettingsDTO
    CustomModelSettingsDTO:
      properties:
        slug:
          type: string
          title: Slug
        extras:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Extras
      type: object
      required:
      - slug
      title: CustomModelSettingsDTO
    CustomProviderDTO:
      properties:
        kind:
          $ref: '#/components/schemas/LLMCustomProviderKind'
        provider:
          $ref: '#/components/schemas/CustomProviderSettingsDTO'
        models:
          items:
            $ref: '#/components/schemas/CustomModelSettingsDTO'
          type: array
          title: Models
        harnesses:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Harnesses
        protocol:
          anyOf:
          - $ref: '#/components/schemas/LLMEndpointProtocol'
          - type: 'null'
        provider_slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider Slug
        model_keys:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Model Keys
      type: object
      required:
      - kind
      - provider
      - models
      title: CustomProviderDTO
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    SubscriptionLoginFailureRequest:
      properties:
        version:
          type: integer
          title: Version
        generation:
          type: integer
          title: Generation
        reason:
          type: string
          maxLength: 200
          title: Reason
      additionalProperties: false
      type: object
      required:
      - version
      - generation
      - reason
      title: SubscriptionLoginFailureRequest
      description: A run reporting that the login it was given no longer works.
    PublicSecretResponseDTO:
      properties:
        slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Slug
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Id
        kind:
          $ref: '#/components/schemas/SecretKind'
        data:
          anyOf:
          - $ref: '#/components/schemas/StandardProviderDTO'
          - $ref: '#/components/schemas/MCPStandardProviderDTO'
          - $ref: '#/components/schemas/CustomProviderDTO'
          - $ref: '#/components/schemas/SSOProviderDTO'
          - $ref: '#/components/schemas/WebhookProviderDTO'
          - $ref: '#/components/schemas/CustomSecretDTO'
          - $ref: '#/components/schemas/ChannelSecretDTO'
          - $ref: '#/components/schemas/OAuthProviderDTO'
          - $ref: '#/components/schemas/OAuthGrantDTO'
          - $ref: '#/components/schemas/SubscriptionProviderDTO'
          title: Data
        header:
          $ref: '#/components/schemas/Header'
        lifecycle:
          anyOf:
          - $ref: '#/components/schemas/LegacyLifecycleDTO'
          - type: 'null'
        write_only:
          type: boolean
          title: Write Only
          default: false
        management:
          anyOf:
          - $ref: '#/components/schemas/PublicSecretManagementDTO'
          - type: 'null'
        value_status:
          $ref: '#/components/schemas/SecretValueStatus'
      type: object
      required:
      - kind
      - data
      - header
      - value_status
      title: PublicSecretResponseDTO
      description: Caller-facing representation after grant-aware value projection.
    SubscriptionLoginAttemptDTO:
      properties:
        id:
          type: string
          title: Id
        expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Expires At
        user_code:
          anyOf:
          - type: string
          - type: 'null'
          title: User Code
        verification_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Verification Uri
        poll_after_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Poll After Ms
        state:
          type: string
          title: State
          default: pending
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        runner_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Runner Address
        runner_replica_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Runner Replica Id
      type: object
      required:
      - id
      title: SubscriptionLoginAttemptDTO
      description: 'The device login this connection waits on, kept on the row.


        The runner pod that runs the provider poll reports the outcome here, and every poll

        answers from this record, so neither the browser''s poll nor the outcome depends on

        reaching that same pod again.'
    ChannelSecretDTO:
      properties:
        kind:
          $ref: '#/components/schemas/ChannelSecretKind'
        channel:
          $ref: '#/components/schemas/ChannelSecretSettingsDTO'
      type: object
      required:
      - kind
      - channel
      title: ChannelSecretDTO
    SubscriptionLoginAttemptResponse:
      properties:
        attempt_id:
          type: string
          title: Attempt Id
        state:
          type: string
          title: State
        user_code:
          anyOf:
          - type: string
          - type: 'null'
          title: User Code
        verification_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Verification Uri
        expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Expires At
        poll_after_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Poll After Ms
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - attempt_id
      - state
      title: SubscriptionLoginAttemptResponse
      description: One device login attempt, as a browser sees it. Never carries the credential.
    StandardProviderDTO:
      properties:
        kind:
          $ref: '#/components/schemas/LLMStandardProviderKind'
        provider:
          $ref: '#/components/schemas/StandardProviderSettingsDTO'
        models:
          anyOf:
          - items:
              $ref: '#/components/schemas/CustomModelSettingsDTO'
            type: array
          - type: 'null'
          title: Models
        harnesses:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Harnesses
      type: object
      required:
      - kind
      - provider
      title: StandardProviderDTO
    ChannelSecretSettingsDTO:
      properties:
        bot_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Bot Token
        signing_secret:
          anyOf:
          - type: string
          - type: 'null'
          title: Signing Secret
        webhook_secret:
          anyOf:
          - type: string
          - type: 'null'
          title: Webhook Secret
        access_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Access Token
        app_secret:
          anyOf:
          - type: string
          - type: 'null'
          title: App Secret
      type: object
      title: ChannelSecretSettingsDTO
      description: 'Vault-stored credential fields only -- things a platform issued and we

        verify. A bridge''s `delivery_url` is not a credential (it is our own

        address to call, not who is calling us) and does not belong here: it

        lives on `ChannelConnectionCreate.data`. Unknown keys passed here are

        silently dropped, so routing a non-credential field through this shape

        would vanish with no error.'
    LLMStandardProviderKind:
      type: string
      enum:
      - mock
      - openai
      - cohere
      - anyscale
      - deepinfra
      - alephalpha
      - groq
      - minimax
      - mistral
      - mistralai
      - anthropic
      - perplexityai
      - together_ai
      - openrouter
      - gemini
      - xai
      title: LLMStandardProviderKind
    MCPStandardProviderDTO:
      properties:
        kind:
          $ref: '#/components/schemas/MCPStandardProviderKind'
        provider:
          $ref: '#/components/schemas/StandardProviderSettingsDTO'
      type: object
      required:
      - kind
      - provider
      title: MCPStandardProviderDTO
    CreateSecretDTO:
      properties:
        slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Slug
        header:
          $ref: '#/components/schemas/Header'
        secret:
          $ref: '#/components/schemas/SecretDTO'
        write_only:
          type: boolean
          title: Write Only
          default: true
      additionalProperties: false
      type: object
      required:
      - header
      - secret
      title: CreateSecretDTO
    LLMCustomProviderKind:
      type: string
      enum:
      - custom
      - azure
      - bedrock
      - sagemaker
      - vertex_ai
      - openai
      - cohere
      - anyscale
      - deepinfra
      - alephalpha
      - groq
      - minimax
      - mistral
      - mistralai
      - anthropic
      - perplexityai
      - together_ai
      - openrouter
      - gemini
      - xai
      title: LLMCustomProviderKind
    CustomSecretDTO:
      properties:
        secret:
          $ref: '#/components/schemas/CustomSecretSettingsDTO'
      type: object
      required:
      - secret
      title: CustomSecretDTO
    SubscriptionLoginPushResponse:
      properties:
        version:
          type: integer
          title: Version
        generation:
          type: integer
          title: Generation
        updated:
          type: boolean
          title: Updated
        stale:
          type: boolean
          title: Stale
          default: false
        login:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Login
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      type: object
      required:
      - version
      - generation
      - updated
      title: SubscriptionLoginPushResponse
      description: 'The push outcome, plus the current login when the run was on an old generation.


        Handing the login back on a stale answer is what lets the runner recover in one hop

        instead of asking for the connection again.'
    ProbeProviderRequest:
      properties:
        kind:
          anyOf:
          - type: string
          - type: 'null'
          title: Kind
          description: 'Provider kind, e.g. ''openai'', ''azure'', ''custom''. Optional when `secret_id` is given: the stored kind is used unless this overrides it.'
        provider:
          $ref: '#/components/schemas/ProviderCredentials'
        secret_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Secret Id
          description: Test the credential stored under this secret, in the caller's project. Fields sent in `provider` override the stored ones.
      type: object
      title: ProbeProviderRequest
      description: 'The credential to test. It is spent on one read and never persisted.


        `kind` is a StandardProviderKind or CustomProviderKind value; `provider` carries the

        same field vocabulary the vault stores, so a card can probe what it is about to save

        without reshaping it.


        `secret_id` names a connection already stored in the caller''s project, and is how a

        write-only connection is testable at all: its value never comes back to the browser,

        so there is nothing for the card to send. The stored kind and credentials are the

        base; anything typed in this request replaces the stored value for that field, which

        is what lets a card test an edit — a new base URL, say — before saving it.'
    MCPStandardProviderKind:
      type: string
      enum:
      - mock
      - composio
      title: MCPStandardProviderKind
    WebhookProviderSettingsDTO:
      properties:
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
      type: object
      title: WebhookProviderSettingsDTO
    OAuthGrantDTO:
      properties:
        grant:
          $ref: '#/components/schemas/OAuthGrantSettingsDTO'
      type: object
      required:
      - grant
      title: OAuthGrantDTO
    DiscoveryStatus:
      type: string
      enum:
      - fetched
      - unsupported
      - failed
      title: DiscoveryStatus
      description: 'Which model identifiers did the provider return?


        `unsupported` means the provider offers no model-list endpoint; `failed` means one

        exists but this attempt did not get an answer. Either way the caller keeps the

        shipped catalog rather than narrowing the user''s model choice.'
    SecretDTO:
      properties:
        kind:
          $ref: '#/components/schemas/SecretKind'
        data:
          anyOf:
          - $ref: '#/components/schemas/StandardProviderDTO'
          - $ref: '#/components/schemas/MCPStandardProviderDTO'
          - $ref: '#/components/schemas/CustomProviderDTO'
          - $ref: '#/components/schemas/SSOProviderDTO'
          - $ref: '#/components/schemas/WebhookProviderDTO'
          - $ref: '#/components/schemas/CustomSecretDTO'
          - $ref: '#/components/schemas/ChannelSecretDTO'
          - $ref: '#/components/schemas/OAuthProviderDTO'
          - $ref: '#/components/schemas/OAuthGrantDTO'
          - $ref: '#/components/schemas/SubscriptionProviderDTO'
          title: Data
      type: object
      required:
      - kind
      - data
      title: SecretDTO
      description: Create-time secret payload. Required credential fields must be present.
    PublicSecretManagementDTO:
      properties:
        policy:
          $ref: '#/components/schemas/SecretManagementPolicy'
      additionalProperties: false
      type: object
      required:
      - policy
      title: PublicSecretManagementDTO
    ChannelSecretKind:
      type: string
      enum:
      - slack
      - telegram
      - whatsapp
      - agenta
      - bridge
      title: ChannelSecretKind
    CredentialResult:
      properties:
        status:
          $ref: '#/components/schemas/CredentialStatus'
        message:
          type: string
          title: Message
      type: object
      required:
      - status
      - message
      title: CredentialResult
    SSOProviderDTO:
      properties:
        provider:
          $ref: '#/components/schemas/SSOProviderSettingsDTO'
      type: object
      required:
      - provider
      title: SSOProviderDTO
    SecretKind:
      type: string
      enum:
      - provider_key
      - custom_provider
      - sso_provider
      - webhook_provider
      - custom_secret
      - channel_secret
      - subscription_provider
      - oauth_provider
      - oauth_grant
      title: SecretKind
    StandardProviderSettingsDTO:
      properties:
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
      type: object
      title: StandardProviderSettingsDTO
    WebhookProviderDTO:
      properties:
        provider:
          $ref: '#/components/schemas/WebhookProviderSettingsDTO'
      type: object
      required:
      - provider
      title: WebhookProviderDTO
    ProviderCredentials:
      properties:
        key:
          anyOf:
          - type: string
            format: password
            writeOnly: true
          - type: 'null'
          title: Key
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
        extras:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Extras
      type: object
      title: ProviderCredentials
      description: 'Credentials in transit only. Never persisted here, never logged, never echoed.


        `key` is a `SecretStr` and `extras` is kept out of `repr`, so an accidental log line

        or traceback that carries this object cannot print the credential. Unwrap the key with

        `.get_secret_value()` at the point it is put on the wire, never earlier.'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LegacyLifecycleDTO:
      properties:
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated At
        updated_by_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated By Id
        updated_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated By
      type: object
      title: LegacyLifecycleDTO
    CustomSecretSettingsDTO:
      properties:
        format:
          $ref: '#/components/schemas/CustomSecretFormat'
        default_env_var:
          anyOf:
          - type: string
          - type: 'null'
          title: Default Env Var
        content:
          anyOf:
          - type: string
          - additionalProperties:
              anyOf:
              - type: string
              - type: integer
              - type: number
              - type: boolean
              - type: 'null'
            type: object
          - type: 'null'
          title: Content
      type: object
      required:
      - format
      title: CustomSecretSettingsDTO
    SubscriptionLoginDTO:
      properties:
        type:
          type: string
          title: Type
          default: oauth
        access:
          anyOf:
          - type: string
          - type: 'null'
          title: Access
        refresh:
          anyOf:
          - type: string
          - type: 'null'
          title: Refresh
        expires:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expires
        accountId:
          anyOf:
          - type: string
          - type: 'null'
          title: Accountid
      additionalProperties: true
      type: object
      title: SubscriptionLoginDTO
      description: 'A harness-format subscription credential, stored and returned verbatim.


        The shape is Pi''s, not ours: extra keys are kept so a Pi version that adds a field

        round-trips through the vault without losing it.'
    LLMEndpointProtocol:
      type: string
      enum:
      - openai
      - anthropic
      title: LLMEndpointProtocol
      description: 'The provider family a custom endpoint speaks, i.e. its request/response shape.


        Chat-completions vs responses is deliberately absent: the relay serves

        `/v1/chat/completions`, `/v1/responses` and `/v1/messages` on every custom endpoint and

        the harness picks the suffix. Only openai-vs-anthropic changes behaviour. A record

        written before this field existed has no value and is read as OpenAI-compatible.'
    SecretValueStatus:
      properties:
        configured:
          type: boolean
          title: Configured
        preview:
          anyOf:
          - type: string
          - type: 'null'
          title: Preview
      type: object
      required:
      - configured
      title: SecretValueStatus
    CredentialStatus:
      type: string
      enum:
      - valid
      - invalid
      - unknown
      title: CredentialStatus
      description: 'Did the provider accept this credential?


        `unknown` is an honest answer, not a failure: it means Agenta found no free,

        read-only endpoint that proves the credential works. A public catalog endpoint

        answering successfully never raises the status above `unknown`.'
    UpdateSecretPayloadDTO:
      properties:
        kind:
          $ref: '#/components/schemas/SecretKind'
        data:
          anyOf:
          - $ref: '#/components/schemas/StandardProviderDTO'
          - $ref: '#/components/schemas/MCPStandardProviderDTO'
          - $ref: '#/components/schemas/CustomProviderDTO'
          - $ref: '#/components/schemas/SSOProviderDTO'
          - $ref: '#/components/schemas/WebhookProviderDTO'
          - $ref: '#/components/schemas/CustomSecretDTO'
          - $ref: '#/components/schemas/ChannelSecretDTO'
          - $ref: '#/components/schemas/OAuthProviderDTO'
          - $ref: '#/components/schemas/OAuthGrantDTO'
          - $ref: '#/components/schemas/SubscriptionProviderDTO'
          title: Data
      type: object
      required:
      - kind
      - data
      title: UpdateSecretPayloadDTO
      description: Update-time payload. Omitted credential fields keep their stored values.
