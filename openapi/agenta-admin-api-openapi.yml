components:
  schemas:
    AdminApiKeyResponse:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        prefix:
          type: string
          title: Prefix
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        project_id:
          type: string
          title: Project Id
        user_id:
          type: string
          title: User Id
        expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Expires At
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        revoked_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Revoked At
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
        returned_once:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Returned Once
      type: object
      required:
      - prefix
      - project_id
      - user_id
      title: AdminApiKeyResponse
    AdminUserIdentityRead:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        user_id:
          type: string
          title: User Id
        method:
          type: string
          title: Method
        subject:
          type: string
          title: Subject
        domain:
          anyOf:
          - type: string
          - type: 'null'
          title: Domain
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        status:
          type: string
          enum:
          - created
          - linked
          - pending_confirmation
          - skipped
          - failed
          title: Status
          default: created
        verified:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Verified
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated At
      type: object
      required:
      - user_id
      - method
      - subject
      title: AdminUserIdentityRead
    AdminSimpleAccountsProjectsCreate:
      properties:
        options:
          anyOf:
          - $ref: '#/components/schemas/AdminAccountCreateOptions'
          - type: 'null'
        project:
          $ref: '#/components/schemas/AdminProjectCreate'
      type: object
      required:
      - project
      title: AdminSimpleAccountsProjectsCreate
    AdminOrganizationRead:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Slug
        owner_user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner User Id
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated At
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
      type: object
      required:
      - id
      - name
      title: AdminOrganizationRead
    AdminSimpleAccountDeleteEntry:
      properties:
        user:
          $ref: '#/components/schemas/EntityRef'
      type: object
      required:
      - user
      title: AdminSimpleAccountDeleteEntry
      description: 'One account entry in a batch simple-accounts delete request.


        Identifies the account by its user (typically by id).'
    AdminDeletedEntity:
      properties:
        id:
          type: string
          title: Id
        ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Ref
      type: object
      required:
      - id
      title: AdminDeletedEntity
    AdminSimpleAccountsOrganizationsCreate:
      properties:
        options:
          anyOf:
          - $ref: '#/components/schemas/AdminAccountCreateOptions'
          - type: 'null'
        organization:
          $ref: '#/components/schemas/AdminOrganizationCreate'
        owner:
          anyOf:
          - $ref: '#/components/schemas/AdminUserCreate'
          - type: 'null'
      type: object
      required:
      - organization
      title: AdminSimpleAccountsOrganizationsCreate
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    AdminProjectMembershipCreate:
      properties:
        project_ref:
          $ref: '#/components/schemas/EntityRef'
        user_ref:
          $ref: '#/components/schemas/EntityRef'
        role:
          type: string
          title: Role
      type: object
      required:
      - project_ref
      - user_ref
      - role
      title: AdminProjectMembershipCreate
    AdminStructuredError:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
      type: object
      required:
      - code
      - message
      title: AdminStructuredError
    AdminSimpleAccountCreate:
      properties:
        options:
          anyOf:
          - $ref: '#/components/schemas/AdminAccountCreateOptions'
          - type: 'null'
        user:
          $ref: '#/components/schemas/AdminUserCreate'
        user_identities:
          anyOf:
          - items:
              $ref: '#/components/schemas/AdminUserIdentityCreate'
            type: array
          - type: 'null'
          title: User Identities
        organization:
          anyOf:
          - $ref: '#/components/schemas/AdminOrganizationCreate'
          - type: 'null'
        workspace:
          anyOf:
          - $ref: '#/components/schemas/AdminWorkspaceCreate'
          - type: 'null'
        project:
          anyOf:
          - $ref: '#/components/schemas/AdminProjectCreate'
          - type: 'null'
        organization_memberships:
          anyOf:
          - items:
              $ref: '#/components/schemas/AdminOrganizationMembershipCreate'
            type: array
          - type: 'null'
          title: Organization Memberships
        workspace_memberships:
          anyOf:
          - items:
              $ref: '#/components/schemas/AdminWorkspaceMembershipCreate'
            type: array
          - type: 'null'
          title: Workspace Memberships
        project_memberships:
