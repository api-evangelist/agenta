          - type: 'null'
      type: object
      required:
      - user
      title: AdminSimpleAccountCreate
      description: One account entry in a batch simple-accounts create request.
    AdminSimpleAccountRead:
      properties:
        user:
          anyOf:
          - $ref: '#/components/schemas/AdminUserRead'
          - type: 'null'
        user_identities:
          anyOf:
          - items:
              $ref: '#/components/schemas/AdminUserIdentityRead'
            type: array
          - type: 'null'
          title: User Identities
        organizations:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/AdminOrganizationRead'
            type: object
          - type: 'null'
          title: Organizations
        workspaces:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/AdminWorkspaceRead'
            type: object
          - type: 'null'
          title: Workspaces
        projects:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/AdminProjectRead'
            type: object
          - type: 'null'
          title: Projects
        organization_memberships:
          anyOf:
          - items:
              $ref: '#/components/schemas/AdminOrganizationMembershipRead'
            type: array
          - type: 'null'
          title: Organization Memberships
        workspace_memberships:
          anyOf:
          - items:
              $ref: '#/components/schemas/AdminWorkspaceMembershipRead'
            type: array
          - type: 'null'
          title: Workspace Memberships
        project_memberships:
          anyOf:
          - items:
              $ref: '#/components/schemas/AdminProjectMembershipRead'
            type: array
          - type: 'null'
