openapi: 3.2.0
info:
  title: Agenta Invocations API
  description: Agenta API
  contact:
    name: Agenta
    url: https://agenta.ai/
    email: team@agenta.ai
  version: 0.1.0
servers:
- url: /api
- url: https://eu.cloud.agenta.ai/api
security:
- APIKeyHeader: []
tags:
- name: Invocations
  description: Run an application against a payload and capture the resulting trace.
paths:
  /invocations/:
    post:
      tags:
      - Invocations
      summary: Create Invocation
      operationId: create_invocation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvocationCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvocationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /invocations/{trace_id}:
    get:
      tags:
      - Invocations
      summary: Fetch Invocation
      operationId: fetch_invocation
      parameters:
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
          title: Trace Id
      - name: span_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Span Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvocationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Invocations
      summary: Edit Invocation
      operationId: edit_invocation
      parameters:
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
          title: Trace Id
      - name: span_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Span Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvocationEditRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvocationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Invocations
      summary: Delete Invocation
      operationId: delete_invocation
      parameters:
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
          title: Trace Id
      - name: span_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Span Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvocationLinkResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /invocations/query:
    post:
      tags:
      - Invocations
      summary: Query Invocations
      operationId: query_invocations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvocationQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvocationsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    SimpleTraceKind:
      type: string
      enum:
      - adhoc
      - eval
      - play
      title: SimpleTraceKind
    InvocationLinkResponse:
      properties:
        count:
          type: integer
          title: Count
          default: 0
        invocation_link:
          anyOf:
          - $ref: '#/components/schemas/OTelLink-Output'
          - type: 'null'
      type: object
      title: InvocationLinkResponse
    Windowing:
      properties:
        newest:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Newest
        oldest:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Oldest
        next:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Next
        limit:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
        order:
          anyOf:
          - type: string
            enum:
            - ascending
            - descending
          - type: 'null'
          title: Order
        interval:
          anyOf:
          - type: integer
          - type: 'null'
          title: Interval
        rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Rate
      type: object
      title: Windowing
    Invocation:
      properties:
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
        deleted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Deleted At
        created_by_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Created By Id
        updated_by_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Updated By Id
        deleted_by_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Deleted By Id
        span_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Span Id
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
        attributes:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/FullJson-Output'
            type: object
          - type: 'null'
          title: Attributes
        origin:
          $ref: '#/components/schemas/SimpleTraceOrigin'
          default: custom
        kind:
          $ref: '#/components/schemas/SimpleTraceKind'
          default: adhoc
        channel:
          $ref: '#/components/schemas/SimpleTraceChannel'
          default: api
        tags:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/LabelJson-Output'
            type: object
          - type: 'null'
          title: Tags
        meta:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/FullJson-Output'
            type: object
          - type: 'null'
          title: Meta
        data:
          additionalProperties:
            $ref: '#/components/schemas/FullJson-Output'
          type: object
          title: Data
        references:
          $ref: '#/components/schemas/SimpleTraceReferences'
        links:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/OTelLink-Output'
            type: object
          - items:
              $ref: '#/components/schemas/OTelLink-Output'
            type: array
          - type: 'null'
          title: Links
      type: object
      required:
      - data
      - references
      - links
      title: Invocation
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    SimpleTraceChannel:
      type: string
      enum:
      - otlp
      - web
      - sdk
      - api
      title: SimpleTraceChannel
    InvocationCreateRequest:
      properties:
        invocation:
          $ref: '#/components/schemas/InvocationCreate'
      type: object
      required:
      - invocation
      title: InvocationCreateRequest
    LabelJson-Output:
      anyOf:
      - type: boolean
      - type: string
      - additionalProperties:
          $ref: '#/components/schemas/LabelJson-Output'
        type: object
    InvocationQuery:
      properties:
        origin:
          anyOf:
          - $ref: '#/components/schemas/SimpleTraceOrigin'
          - type: 'null'
        kind:
          anyOf:
          - $ref: '#/components/schemas/SimpleTraceKind'
          - type: 'null'
        channel:
          anyOf:
          - $ref: '#/components/schemas/SimpleTraceChannel'
          - type: 'null'
        tags:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/LabelJson-Input'
            type: object
          - type: 'null'
          title: Tags
        meta:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/FullJson-Input'
            type: object
          - type: 'null'
          title: Meta
        references:
          anyOf:
          - $ref: '#/components/schemas/SimpleTraceReferences'
          - type: 'null'
        links:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/OTelLink-Input'
            type: object
          - items:
              $ref: '#/components/schemas/OTelLink-Input'
            type: array
          - type: 'null'
          title: Links
      type: object
      title: InvocationQuery
    InvocationEdit:
      properties:
        tags:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/LabelJson-Input'
            type: object
          - type: 'null'
          title: Tags
        meta:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/FullJson-Input'
            type: object
          - type: 'null'
          title: Meta
        data:
          additionalProperties:
            $ref: '#/components/schemas/FullJson-Input'
          type: object
          title: Data
        references:
          anyOf:
          - $ref: '#/components/schemas/SimpleTraceReferences'
          - type: 'null'
        links:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/OTelLink-Input'
            type: object
          - items:
              $ref: '#/components/schemas/OTelLink-Input'
            type: array
          - type: 'null'
          title: Links
      type: object
      required:
      - data
      title: InvocationEdit
    InvocationsResponse:
      properties:
        count:
          type: integer
          title: Count
          default: 0
        invocations:
          items:
            $ref: '#/components/schemas/Invocation'
          type: array
          title: Invocations
          default: []
      type: object
      title: InvocationsResponse
    LabelJson-Input:
      anyOf:
      - type: boolean
      - type: string
      - additionalProperties:
          $ref: '#/components/schemas/LabelJson-Input'
        type: object
    InvocationCreate:
      properties:
        origin:
          $ref: '#/components/schemas/SimpleTraceOrigin'
          default: custom
        kind:
          $ref: '#/components/schemas/SimpleTraceKind'
          default: adhoc
        channel:
          $ref: '#/components/schemas/SimpleTraceChannel'
          default: api
        tags:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/LabelJson-Input'
            type: object
          - type: 'null'
          title: Tags
        meta:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/FullJson-Input'
            type: object
          - type: 'null'
          title: Meta
        data:
          additionalProperties:
            $ref: '#/components/schemas/FullJson-Input'
          type: object
          title: Data
        references:
          $ref: '#/components/schemas/SimpleTraceReferences'
        links:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/OTelLink-Input'
            type: object
          - items:
              $ref: '#/components/schemas/OTelLink-Input'
            type: array
          - type: 'null'
          title: Links
      type: object
      required:
      - data
      - references
      - links
      title: InvocationCreate
    FullJson-Input:
      anyOf:
      - type: string
      - type: integer
      - type: number
      - type: boolean
      - additionalProperties:
          $ref: '#/components/schemas/FullJson-Input'
        type: object
      - items:
          $ref: '#/components/schemas/FullJson-Input'
        type: array
      - type: 'null'
    Reference:
      properties:
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
        slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Slug
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Id
      type: object
      title: Reference
    FullJson-Output:
      anyOf:
      - type: string
      - type: integer
      - type: number
      - type: boolean
      - additionalProperties:
          $ref: '#/components/schemas/FullJson-Output'
        type: object
      - items:
          $ref: '#/components/schemas/FullJson-Output'
        type: array
      - type: 'null'
    OTelLink-Input:
      properties:
        span_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Span Id
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
        attributes:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/FullJson-Input'
            type: object
          - type: 'null'
          title: Attributes
      type: object
      title: OTelLink
    OTelLink-Output:
      properties:
        span_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Span Id
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
        attributes:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/FullJson-Output'
            type: object
          - type: 'null'
          title: Attributes
      type: object
      title: OTelLink
    SimpleTraceOrigin:
      type: string
      enum:
      - custom
      - human
      - auto
      title: SimpleTraceOrigin
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InvocationResponse:
      properties:
        count:
          type: integer
          title: Count
          default: 0
        invocation:
          anyOf:
          - $ref: '#/components/schemas/Invocation'
          - type: 'null'
      type: object
      title: InvocationResponse
    InvocationQueryRequest:
      properties:
        invocation:
          anyOf:
          - $ref: '#/components/schemas/InvocationQuery'
          - type: 'null'
        invocation_links:
          anyOf:
          - items:
              $ref: '#/components/schemas/OTelLink-Input'
            type: array
          - type: 'null'
          title: Invocation Links
        windowing:
          anyOf:
          - $ref: '#/components/schemas/Windowing'
          - type: 'null'
      type: object
      title: InvocationQueryRequest
    InvocationEditRequest:
      properties:
        invocation:
          $ref: '#/components/schemas/InvocationEdit'
      type: object
      required:
      - invocation
      title: InvocationEditRequest
    SimpleTraceReferences:
      properties:
        query:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        query_variant:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        query_revision:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        testset:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        testset_variant:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        testset_revision:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        application:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        application_variant:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        application_revision:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        evaluator:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        evaluator_variant:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        evaluator_revision:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        environment:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        environment_variant:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        environment_revision:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        testcase:
          anyOf:
          - $ref: '#/components/schemas/Reference'
          - type: 'null'
        selector:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Selector
      type: object
      title: SimpleTraceReferences
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      name: Authorization
      in: header
