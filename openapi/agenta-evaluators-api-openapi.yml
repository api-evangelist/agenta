          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Slug
      type: object
      title: EvaluatorCreate
    EvaluatorCatalogTypesResponse:
      properties:
        count:
          type: integer
          title: Count
          description: Number of types in `types`.
          default: 0
