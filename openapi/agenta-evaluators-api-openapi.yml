openapi: 3.2.0
info:
  title: Agenta Evaluators API
  description: Agenta API
  contact:
    name: Agenta
    url: https://agenta.ai/
    email: team@agenta.ai
  version: 0.1.0
servers:
- url: /api
- url: https://eu.cloud.agenta.ai/api
security:
- APIKeyHeader: []
tags:
- name: Evaluators
  description: Evaluator definitions — the metrics and judges used in evaluation runs.
paths:
  /evaluators/catalog/types/:
    get:
      tags:
      - Evaluators
      summary: List Evaluator Catalog Types
      description: 'List the JSON schema types the evaluator catalog understands.


        Types are static metadata shipped with the product. Use this when

        rendering a catalog UI or validating that a template''s schema is

        supported. See the Evaluators guide for how the catalog relates

        to user-owned evaluator artifacts.'
      operationId: list_evaluator_catalog_types
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorCatalogTypesResponse'
  /evaluators/catalog/templates/:
    get:
      tags:
      - Evaluators
      summary: List Evaluator Catalog Templates
      description: 'List evaluator templates from the catalog.


        Templates are blueprints that describe an evaluator''s handler

        URI, JSON schemas, and default configuration. Pass

        `include_archived=true` to include deprecated templates. Use the

        returned `key` with `/catalog/templates/{template_key}/presets/`

        to list its presets.'
      operationId: list_evaluator_catalog_templates
      parameters:
      - name: include_archived
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Include Archived
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorCatalogTemplatesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/catalog/templates/{template_key}:
    get:
      tags:
      - Evaluators
      summary: Fetch Evaluator Catalog Template
      description: 'Fetch one evaluator template by key.


        Returns an empty envelope (`count: 0`) when no template matches

        the key. Template keys come from

        `GET /catalog/templates/`.'
      operationId: fetch_evaluator_catalog_template
      parameters:
      - name: template_key
        in: path
        required: true
        schema:
          type: string
          title: Template Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorCatalogTemplateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/catalog/templates/{template_key}/presets/:
    get:
      tags:
      - Evaluators
      summary: List Evaluator Catalog Presets
      description: 'List presets defined against one evaluator template.


        A preset is a named set of parameter values pre-filled against

        the template. Use the returned `key` to fetch a specific preset

        via `GET /catalog/templates/{template_key}/presets/{preset_key}`.'
      operationId: list_evaluator_catalog_presets
      parameters:
      - name: template_key
        in: path
        required: true
        schema:
          type: string
          title: Template Key
      - name: include_archived
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Include Archived
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorCatalogPresetsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/catalog/templates/{template_key}/presets/{preset_key}:
    get:
      tags:
      - Evaluators
      summary: Fetch Evaluator Catalog Preset
      description: 'Fetch one evaluator preset by template and preset key.


        Presets are not separate entities; they are metadata. Use the

        returned preset payload as the starting point when creating a

        new evaluator from a template. See the Evaluators guide.'
      operationId: fetch_evaluator_catalog_preset
      parameters:
      - name: template_key
        in: path
        required: true
        schema:
          type: string
          title: Template Key
      - name: preset_key
        in: path
        required: true
        schema:
          type: string
          title: Preset Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorCatalogPresetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/:
    post:
      tags:
      - Evaluators
      summary: Create Evaluator
      description: 'Create an evaluator artifact, its first variant, and its initial revision.


        Use this endpoint when you already know you want to manage the

        artifact / variant / revision layers independently. For a

        one-shot "create and forget" call that returns a flat record,

        see `POST /simple/evaluators/`. See the Versioning guide for

        commit semantics.'
      operationId: create_evaluator
      parameters:
      - name: evaluator_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Evaluator Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluatorCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/{evaluator_id}:
    get:
      tags:
      - Evaluators
      summary: Fetch Evaluator
      description: 'Fetch an evaluator artifact by id.


        Returns the artifact-level record (slug, name, flags, lifecycle)

        without variant or revision data. Use the variant and revision

        endpoints to retrieve those layers.'
      operationId: fetch_evaluator
      parameters:
      - name: evaluator_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evaluator Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Evaluators
      summary: Edit Evaluator
      description: 'Edit an evaluator artifact''s metadata.


        Edits are limited to metadata fields (description, tags, meta).

        Renaming is temporarily disabled and returns 400. To change

        evaluator behavior, commit a new revision on the variant — see

        `/evaluators/revisions/commit`.'
      operationId: edit_evaluator
      parameters:
      - name: evaluator_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evaluator Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluatorEditRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/{evaluator_id}/archive:
    post:
      tags:
      - Evaluators
      summary: Archive Evaluator
      description: 'Soft-delete an evaluator artifact.


        Sets `deleted_at` on the evaluator and hides it from subsequent

        `/query` responses unless `include_archived=true`. Revision IDs

        remain resolvable so historical traces stay intact.'
      operationId: archive_evaluator
      parameters:
      - name: evaluator_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evaluator Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/{evaluator_id}/unarchive:
    post:
      tags:
      - Evaluators
      summary: Unarchive Evaluator
      description: 'Restore a soft-deleted evaluator artifact.


        Clears `deleted_at` on the evaluator so it re-appears in `/query`

        responses.'
      operationId: unarchive_evaluator
      parameters:
      - name: evaluator_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evaluator Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/query:
    post:
      tags:
      - Evaluators
      summary: Query Evaluators
      description: 'Query evaluator artifacts with filters and pagination.


        Returns artifact-level records only. The request body follows

        the shared query pattern (filter + refs + windowing). Send `{}`

        to list all evaluators in the project. See the Query Pattern

        guide.'
      operationId: query_evaluators
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluatorQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/variants/:
    post:
      tags:
      - Evaluators
      summary: Create Evaluator Variant
      description: 'Create a new variant on an existing evaluator.


        A variant is a named branch of the evaluator''s history. New

        revisions committed to this variant do not touch other variants.

        See the Versioning guide.'
      operationId: create_evaluator_variant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluatorVariantCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/variants/{evaluator_variant_id}:
    get:
      tags:
      - Evaluators
      summary: Fetch Evaluator Variant
      description: 'Fetch an evaluator variant by id.


        Returns the variant record (slug, flags, lifecycle) without the

        committed revisions. Use `/evaluators/revisions/retrieve` to

        read the variant''s current revision payload.'
      operationId: fetch_evaluator_variant
      parameters:
      - name: evaluator_variant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evaluator Variant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Evaluators
      summary: Edit Evaluator Variant
      description: 'Edit a variant''s metadata.


        Edits only touch variant-level metadata. To change evaluator

        behavior commit a new revision via

        `/evaluators/revisions/commit`.'
      operationId: edit_evaluator_variant
      parameters:
      - name: evaluator_variant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evaluator Variant Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluatorVariantEditRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/variants/{evaluator_variant_id}/archive:
    post:
      tags:
      - Evaluators
      summary: Archive Evaluator Variant
      description: 'Soft-delete an evaluator variant.


        Sets `deleted_at` on the variant. Its revisions stay resolvable

        by id; they are hidden from `/query` unless the caller sets

        `include_archived=true`.'
      operationId: archive_evaluator_variant
      parameters:
      - name: evaluator_variant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evaluator Variant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/variants/{evaluator_variant_id}/unarchive:
    post:
      tags:
      - Evaluators
      summary: Unarchive Evaluator Variant
      description: Restore a soft-deleted evaluator variant.
      operationId: unarchive_evaluator_variant
      parameters:
      - name: evaluator_variant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evaluator Variant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/variants/query:
    post:
      tags:
      - Evaluators
      summary: Query Evaluator Variants
      description: 'Query evaluator variants with filters, reference scoping, and pagination.


        Accepts parameters from both the query string and a JSON body;

        the two are merged. Use `evaluator_refs` to scope to one or more

        evaluators, or `evaluator_variant_refs` for specific variants.'
      operationId: query_evaluator_variants
      parameters:
      - name: evaluator_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Evaluator Id
      - name: evaluator_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          title: Evaluator Ids
      - name: evaluator_slug
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Evaluator Slug
      - name: evaluator_slugs
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Evaluator Slugs
      - name: evaluator_variant_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Evaluator Variant Id
      - name: evaluator_variant_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          title: Evaluator Variant Ids
      - name: evaluator_variant_slug
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Evaluator Variant Slug
      - name: evaluator_variant_slugs
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Evaluator Variant Slugs
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      - name: description
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      - name: flags
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Flags
      - name: tags
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tags
      - name: meta
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Meta
      - name: include_archived
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Include Archived
      - name: next
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Next
      - name: newest
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Newest
      - name: oldest
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Oldest
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
      - name: order
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - ascending
            - descending
            type: string
          - type: 'null'
          title: Order
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorVariantsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/variants/fork:
    post:
      tags:
      - Evaluators
      summary: Fork Evaluator Variant
      description: 'Fork an evaluator variant into a new variant.


        Creates a new branch whose initial revision is copied from the

        source. Use this to experiment without touching the original.

        The returned variant has a fresh id and slug but inherits

        lineage metadata from its source.'
      operationId: fork_evaluator_variant
      parameters:
      - name: evaluator_variant_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Evaluator Variant Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluatorVariantForkRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorVariantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/revisions/retrieve:
    post:
      tags:
      - Evaluators
      summary: Retrieve Evaluator Revision
      description: 'Retrieve one evaluator revision, either directly or via an environment key.


        Provide one of:

        an evaluator / variant / revision reference (returns that

        revision, or the latest revision on the variant or evaluator),

        or an environment reference plus `key` (returns the revision

        currently pinned to that key). Supplying both forms returns 400.

        Pass `resolve=true` to expand embedded references on the

        returned payload.'
      operationId: retrieve_evaluator_revision
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluatorRevisionRetrieveRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/revisions/deploy:
    post:
      tags:
      - Evaluators
      summary: Deploy Evaluator Revision
      description: 'Pin an evaluator revision into an environment revision under a key.


        Requires an evaluator ref (`evaluator_ref`,

        `evaluator_variant_ref`, or `evaluator_revision_ref`) and an

        environment ref. When `key` is omitted it defaults to

        `.revision`. The deployment is recorded as a

        new commit on the environment revision. See the Evaluators

        guide for the deployment model.'
      operationId: deploy_evaluator_revision
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluatorRevisionDeployRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/revisions/:
    post:
      tags:
      - Evaluators
      summary: Create Evaluator Revision
      description: 'Create and commit the initial revision for an evaluator variant.


        Prefer `/evaluators/revisions/commit` for the standard commit

        flow. This endpoint commits an initial revision with the `initial`

        guard, preventing duplicate initial revisions for the same variant.'
      operationId: create_evaluator_revision
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluatorRevisionCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/revisions/{evaluator_revision_id}:
    get:
      tags:
      - Evaluators
      summary: Fetch Evaluator Revision
      description: 'Fetch a specific evaluator revision by id.


        Returns the full revision including `data` (handler uri,

        schemas, and parameters). To pick the latest revision on a

        variant without knowing its id, use

        `/evaluators/revisions/retrieve`.'
      operationId: fetch_evaluator_revision
      parameters:
      - name: evaluator_revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evaluator Revision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Evaluators
      summary: Edit Evaluator Revision
      description: 'Edit a revision''s metadata.


        Revision `data` is immutable once committed. This endpoint is

        for metadata fields only (description, tags, meta). To change

        evaluator behavior, commit a new revision instead.'
      operationId: edit_evaluator_revision
      parameters:
      - name: evaluator_revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evaluator Revision Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluatorRevisionEditRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/revisions/{evaluator_revision_id}/archive:
    post:
      tags:
      - Evaluators
      summary: Archive Evaluator Revision
      description: 'Soft-delete an evaluator revision.


        Archived revisions remain resolvable by id but are excluded from

        revision logs and queries unless `include_archived=true`.'
      operationId: archive_evaluator_revision
      parameters:
      - name: evaluator_revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evaluator Revision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/revisions/{evaluator_revision_id}/unarchive:
    post:
      tags:
      - Evaluators
      summary: Unarchive Evaluator Revision
      description: Restore a soft-deleted evaluator revision.
      operationId: unarchive_evaluator_revision
      parameters:
      - name: evaluator_revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evaluator Revision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/revisions/query:
    post:
      tags:
      - Evaluators
      summary: Query Evaluator Revisions
      description: 'Query evaluator revisions with filters, reference scoping, and pagination.


        Returns revision payloads. Use `evaluator_refs`,

        `evaluator_variant_refs`, or `evaluator_revision_refs` to scope

        the query.'
      operationId: query_evaluator_revisions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluatorRevisionQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorRevisionsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/revisions/commit:
    post:
      tags:
      - Evaluators
      summary: Commit Evaluator Revision
      description: 'Commit a new revision on an evaluator variant.


        The commit body carries the target `evaluator_variant_id`, an

        optional `message`, and the revision `data` (handler uri,

        schemas, parameters). A committed revision is immutable.'
      operationId: commit_evaluator_revision
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluatorRevisionCommitRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/revisions/log:
    post:
      tags:
      - Evaluators
      summary: Log Evaluator Revisions
      description: 'List the revision log of an evaluator variant.


        Returns revisions in commit order. Scope the log by supplying

        an evaluator, variant, or revision reference. Use the retrieve

        endpoint to fetch a specific revision''s full payload.'
      operationId: log_evaluator_revisions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluatorRevisionsLogRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorRevisionsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evaluators/revisions/resolve:
    post:
      tags:
      - Evaluators
      summary: Resolve Evaluator Revision
      description: 'Resolve embedded references on an evaluator revision''s `data`.


        Walks embedded references (for example, references to other

        revisions or to secrets) up to `max_depth` and `max_embeds`.

        The response includes a `resolution_info` block with counts,

        depth reached, and errors according to `error_policy`.'
      operationId: resolve_evaluator_revision
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluatorRevisionResolveRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorRevisionResolveResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simple/evaluators/:
    post:
      tags:
      - Evaluators
      summary: Create Simple Evaluator
      description: 'Create an evaluator via the simple surface.


        Creates the artifact, its first variant, and its initial

        revision in one call. Returns the flat evaluator record

        (latest revision merged into `data`). Use this when you do not

        need to manage variants or revisions directly.'
      operationId: create_simple_evaluator
      parameters:
      - name: evaluator_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Evaluator Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimpleEvaluatorCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleEvaluatorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simple/evaluators/templates:
    get:
      tags:
      - Evaluators
      summary: List Evaluator Templates
      description: 'List the legacy built-in evaluator templates.


        Returns static evaluator-type definitions shipped with the

        product. Prefer the `/evaluators/catalog/*` endpoints for new

        integrations; this endpoint is kept for older clients. Pass

        `include_archived=true` to include deprecated templates.'
      operationId: list_evaluator_templates
      parameters:
      - name: include_archived
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Include Archived
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorTemplatesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simple/evaluators/{evaluator_id}:
    get:
      tags:
      - Evaluators
      summary: Fetch Simple Evaluator
      description: 'Fetch one evaluator via the simple surface.


        Returns the flat evaluator record including its current variant

        and revision ids and the merged `data` payload.'
      operationId: fetch_simple_evaluator
      parameters:
      - name: evaluator_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evaluator Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleEvaluatorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Evaluators
      summary: Edit Simple Evaluator
      description: 'Edit an evaluator via the simple surface.


        Touches metadata and (when `data` is supplied) commits a new

        revision on the evaluator''s variant. Renaming is temporarily

        disabled and returns 400.'
      operationId: edit_simple_evaluator
      parameters:
      - name: evaluator_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evaluator Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimpleEvaluatorEditRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleEvaluatorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simple/evaluators/{evaluator_id}/archive:
    post:
      tags:
      - Evaluators
      summary: Archive Simple Evaluator
      description: 'Soft-delete an evaluator via the simple surface.


        Archives the underlying artifact. Historical traces that

        reference specific revision ids remain resolvable.'
      operationId: archive_simple_evaluator
      parameters:
      - name: evaluator_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evaluator Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleEvaluatorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simple/evaluators/{evaluator_id}/unarchive:
    post:
      tags:
      - Evaluators
      summary: Unarchive Simple Evaluator
      description: Restore a soft-deleted evaluator via the simple surface.
      operationId: unarchive_simple_evaluator
      parameters:
      - name: evaluator_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evaluator Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleEvaluatorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simple/evaluators/query:
    post:
      tags:
      - Evaluators
      summary: Query Simple Evaluators
      description: 'Query evaluators via the simple surface with filters and pagination.


        Returns flat evaluator records (one per artifact with its

        latest variant and revision merged into `data`). Send `{}` to

        list all evaluators in the project. See the Query Pattern

        guide.'
      operationId: query_simple_evaluators
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimpleEvaluatorQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleEvaluatorsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    EvaluatorCatalogPresetsResponse:
      properties:
        count:
          type: integer
          title: Count
          description: Number of presets in `presets`.
          default: 0
        presets:
          items:
            $ref: '#/components/schemas/EvaluatorCatalogPreset'
          type: array
          title: Presets
          description: Named parameter presets defined against a template.
      type: object
      title: EvaluatorCatalogPresetsResponse
      description: Envelope for a list of catalog presets.
    EvaluatorCreateRequest:
      properties:
        evaluator:
          $ref: '#/components/schemas/EvaluatorCreate'
          description: Evaluator payload (slug, name, flags, data). Slug is required and scoped to the project.
      type: object
      required:
      - evaluator
      title: EvaluatorCreateRequest
      description: 'Body for creating an evaluator artifact.


        Creating an evaluator also provisions its first variant and its initial

        revision. The evaluator shares the artifact / variant / revision model

        used across versioned resources — see the Versioning guide.'
    EvaluatorVariantCreateRequest:
      properties:
        evaluator_variant:
          $ref: '#/components/schemas/EvaluatorVariantCreate'
          description: Variant payload. Requires the parent `evaluator_id`.
      type: object
      required:
      - evaluator_variant
      title: EvaluatorVariantCreateRequest
      description: Body for creating a new variant on an existing evaluator.
    EvaluatorArtifactQueryFlags:
      properties:
        is_application:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Application
        is_evaluator:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Evaluator
        is_snippet:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Snippet
      type: object
      title: EvaluatorArtifactQueryFlags
