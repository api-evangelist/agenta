    WorkflowRevisionDelta:
      properties:
        set:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Set
        remove:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Remove
        operations:
          anyOf:
          - items:
              $ref: '#/components/schemas/WorkflowRevisionOperation'
            type: array
          - type: 'null'
          title: Operations
      type: object
      title: WorkflowRevisionDelta
      description: "Delta operations on a workflow revision's data tree.\n\nTwo forms, never mixed (contract 3):\n\n- **legacy** — ``set``: a partial data tree deep-merged onto the base revision's data\n  (nested dicts merge; scalars and lists replace); ``remove``: dotted key paths to\n  delete (e.g. ``parameters.agent.tools``).\n- **ordered** — ``operations``: the seven verbs, applied in array order, all or\n  nothing.\n\nThe engine enforces the exclusivity and every operation rule; this model only carries\nthe shapes.\n\nUnknown keys beside ``set``/``remove``/``operations`` are refused on the ORDERED arm\nonly, so a caller cannot believe it sent an operation modifier the server never saw.\nA pure-legacy envelope keeps its shipped tolerance: the server has always ignored\nstray keys there, and playbooks in the field send them. Neither rule reaches the tree\ninside ``set``, which stays free-form."
