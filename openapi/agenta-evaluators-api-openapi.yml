          type: integer
          title: Depth Reached
        embeds_resolved:
          type: integer
          title: Embeds Resolved
        errors:
          items:
            type: string
          type: array
          title: Errors
          default: []
      type: object
      required:
      - references_used
      - depth_reached
      - embeds_resolved
      title: ResolutionInfo
