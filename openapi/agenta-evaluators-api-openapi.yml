        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        key:
          type: string
          title: Key
        categories:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Categories
        flags:
          anyOf:
          - $ref: '#/components/schemas/WorkflowCatalogFlags'
          - type: 'null'
        data:
          anyOf:
          - $ref: '#/components/schemas/WorkflowRevisionData-Output'
          - type: 'null'
      type: object
      required:
      - key
      title: EvaluatorCatalogPreset
    WorkflowRevisionOperation:
      properties:
        operation:
          type: string
          enum:
          - set
          - merge
          - remove
          - edit_text
          - add_item
          - replace_item
          - remove_item
          title: Operation
        target:
          items: {}
          type: array
          title: Target
        value:
          anyOf:
          - {}
          - type: 'null'
          title: Value
        edits:
          anyOf:
          - items:
              additionalProperties:
                type: string
              type: object
            type: array
          - type: 'null'
          title: Edits
        match_mode:
          anyOf:
          - type: string
            enum:
