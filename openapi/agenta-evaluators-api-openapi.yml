        workflow_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Workflow Id
        artifact_slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Artifact Slug
        artifact_id:
          anyOf:
          - type: string
