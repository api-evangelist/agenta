    SessionReference:
      properties:
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
        slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Slug
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Id
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
      type: object
      title: SessionReference
      description: 'A reference element that carries its own family.


        Sessions persist references as a flat list (`session_turns.references`,

        `session_streams.references`), so the map key that named the family upstream is

        gone by the time a reader sees the row — leaving "first UUID in the list" as the

        only way to guess which element is the workflow.


        ``key`` is the name `evaluation_runs.references` already uses for the same flat-list

        discriminator (`dbs/postgres/evaluations/utils.py`), and the same one tracing carries

        in `OTelReference.attributes["key"]`.


        It is a plain string rather than ``ReferenceKey`` on purpose: a turn append is

        fire-and-forget, so rejecting an unrecognized family would drop the whole turn, which

        is the failure this field exists to prevent. Producers inside the API use

        ``ReferenceKey``; readers treat anything else as untyped.'
    SessionMessagePreview:
      properties:
        text:
          type: string
          maxLength: 240
          title: Text
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
        timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Timestamp
      type: object
      required:
      - text
      title: SessionMessagePreview
      description: 'The last thing said in a session, for a list row.


        A session row carried a title and a timestamp, so deciding whether a session was worth

        reopening meant opening it. Only `message` records are considered: `done`/`usage` are

        bookkeeping, `thought` is not addressed to anyone, and a `tool_call` says what the agent

        reached for rather than what it concluded.'
    SessionRecord:
      properties:
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
