      title: HarnessKind
      description: 'The coding agent program a run drives. A backend declares which it supports.


        ``pi_core`` is Pi; ``claude`` drives Claude Code; ``codex`` drives Codex.

        ``mock`` drives no real coding agent at all: it is a deterministic, LLM-free, network-free

        stand-in for testing, selecting a named behavior the runner resolves in-process.'
    MountFlags:
      properties: {}
      type: object
      title: MountFlags
    SessionSnapshotResponse:
      properties:
        session:
          anyOf:
          - $ref: '#/components/schemas/SessionStream'
          - type: 'null'
        execution:
          anyOf:
          - $ref: '#/components/schemas/SessionTurn'
          - type: 'null'
        execution_state:
          $ref: '#/components/schemas/SessionExecutionSnapshot'
        pending:
          $ref: '#/components/schemas/SessionSnapshotPending'
        read:
          anyOf:
          - $ref: '#/components/schemas/SessionRecordsReadState'
