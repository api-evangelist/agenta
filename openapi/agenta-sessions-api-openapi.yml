      title: SessionListItem
      description: 'A `/sessions/query` row, enriched at READ time with the session''s last message.


        `references` prefers the stream row''s own (filled once at run time) and falls back to

        the HIGHEST `turn_index` turn''s — the agent/workflow that produced the latest turn.

        The fallback is what keeps rows written before the stream column existed openable.

        Both enrichments are batch lookups keyed on the whole page; never one call per row.


        Hydrated by `SessionsService.query_sessions`.'
    SessionTranscriptWindowing:
      properties:
        offset:
          type: integer
          minimum: 0.0
          title: Offset
          default: 0
        limit:
          type: integer
          maximum: 200.0
          minimum: 1.0
          title: Limit
          default: 100
        through_sequence:
          type: integer
          minimum: 0.0
          title: Through Sequence
      type: object
      required:
      - through_sequence
      title: SessionTranscriptWindowing
      description: 'Deliberate exception to the shared cursor `Windowing`.


        `through_sequence` pins the snapshot, so offset paging over an append-only log inside that

        bound is stable: a concurrent append raises `latest_sequence`, never the page contents. The

        transcript reader also needs to seek within one pinned snapshot, which a forward-only cursor

        cannot express.'
