openapi: 3.2.0
info:
  title: Agenta Traces API
  description: Agenta API
  contact:
    name: Agenta
    url: https://agenta.ai/
    email: team@agenta.ai
  version: 0.1.0
servers:
- url: /api
- url: https://eu.cloud.agenta.ai/api
security:
- APIKeyHeader: []
tags:
- name: Traces
  description: Ingest and query traces, spans, and metrics from running applications.
paths:
  /traces/:
    get:
      tags:
      - Traces
      summary: Fetch Traces
      description: 'Fetch multiple traces by known IDs.


        Point lookup endpoint. Accepts either repeated query params

        (`?trace_id=a&trace_id=b`) or a comma-separated single param

        (`?trace_ids=a,b`). Results are deduplicated. Returns `400` when

        no IDs are supplied. Use `POST /traces/query` for filter-based

        retrieval.'
      operationId: fetch_traces
      parameters:
      - name: trace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Trace Id
      - name: trace_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TracesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Traces
      summary: Create Trace
      description: 'Create a single trace from the canonical `Trace` shape.


        Accepts one trace (`trace_id` plus a nested `spans` tree) and

        returns the resulting `trace_id`. The payload is internally

        normalized into the same ingest pipeline as

        `POST /tracing/spans/ingest`.


        Returns `202 Accepted`. The async write contract applies — see

        Tracing — Async write

        contract.


        Use this when you want to operate on whole traces in the

        list-shaped `Trace` payload. For flat-list ingestion or multiple

        traces in one call, use `POST /traces/ingest` (plural).'
      operationId: create_trace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TraceRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceIdResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /traces/query:
    post:
      tags:
      - Traces
      summary: Query Traces
      description: 'Query traces as a list of canonical `Trace` records.


        Thin wrapper over the shared span-query backend that forces

        `focus = "trace"` and returns the list-shaped `Traces` payload

        (one entry per trace, each with its nested `spans` tree). Use this

        to build a table of runs, where each row is a trace.


        ## Request body


        - `filtering` — span-level conditions, same dialect as

        `POST /spans/query`. A trace matches when any of its spans

        matches.

        - `windowing` — cursor pagination and time range.

        - `query_ref`, `query_variant_ref`, `query_revision_ref` — resolve

        filters and windowing from a saved query revision. If the

        revision''s stored `formatting.focus` is `span`, this endpoint

        returns `409` — call `POST /spans/query` instead.


        ## Response


        Returns `{count, traces: [...], windowing}`. One response holds at most

        one page: 100 traces when `windowing.limit` is not set, and never more

        than 1000 (the server settings `AGENTA_API_TRACING_QUERY_DEFAULT_LIMIT`

        and `AGENTA_API_TRACING_QUERY_MAX_LIMIT`). `windowing` is present when

        the page is full: send it as `windowing` to read the next page. A

        trace with matching spans on both sides of a page boundary can appear

        on both pages; deduplicate by `trace_id`. A query that filters only on

        `trace_id` returns those traces whole, with no limit.


        Span `attributes` leave out `ag.data.parameters.agent.skills` (the

        skill text of an agent run), except when the query filters only on

        `trace_id`. `GET /traces/{trace_id}` returns it too.


        For the per-trace map shape

        keyed by `trace_id`, call `POST /tracing/spans/query` with

        `focus="trace"`.'
      operationId: query_traces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TracesQueryRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TracesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /traces/{trace_id}:
    get:
      tags:
      - Traces
      summary: Fetch Trace
      description: 'Fetch a single trace by `trace_id` in the canonical `Trace` shape.


        Returns `{count: 1, trace}` when found and `{count: 0}` otherwise.

        `trace_id` must be a 32-char hex UUID; any other format returns

        `400`. The reserved path segments `query` and `ingest` return

        `405` to disambiguate from the sibling query/ingest endpoints.'
      operationId: fetch_trace
      parameters:
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
          title: Trace Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Traces
      summary: Edit Trace
      description: 'Replace a trace''s spans using the canonical `Trace` shape.


        Path `trace_id` must match the `trace_id` inside the payload''s

        `trace.trace_id`. Mismatches return `400`. The payload must

        describe exactly one trace.


        Edit re-ingests the spans through the same stream as

        `POST /tracing/spans/ingest`. Returns `202 Accepted` once the

        spans are queued. The worker reconciles the trace asynchronously.'
      operationId: edit_trace
      parameters:
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
          title: Trace Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TraceRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceIdResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Traces
      summary: Delete Trace
      operationId: delete_trace
      parameters:
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
          title: Trace Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceIdResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /spans/:
    get:
      tags:
      - Traces
      summary: Fetch Spans
      description: 'Fetch spans by known IDs.


        Point lookup endpoint. At least one of `trace_id` or `span_id`

        must be present. Both accept either repeated query params

        (`?trace_id=a&trace_id=b`) or a comma-separated single param

        (`?trace_ids=a,b`); results are deduplicated.


        Returns `400` when neither IDs nor trace IDs are supplied.

        For filter-based retrieval, use `POST /spans/query`.'
      operationId: fetch_spans
      parameters:
      - name: trace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Trace Id
      - name: trace_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Ids
      - name: span_id
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Span Id
      - name: span_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Span Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpansResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /spans/query:
    post:
      tags:
      - Traces
      summary: Query Spans
      description: 'Query spans as a flat list.


        Thin wrapper over the shared span-query backend that forces

        `focus = "span"`. Use this when you want a paged list of spans

        regardless of trace hierarchy — for example, to surface all LLM

        calls across traces or to stream spans into an external system.


        ## Request body


        - `filtering` — span-level conditions (fields on `Span` and

        `attributes` paths).

        - `windowing` — cursor pagination and time range (see

        Query Pattern).

        - `query_ref`, `query_variant_ref`, `query_revision_ref` — resolve

        filtering and windowing from a saved query revision. If the

        revision''s stored `formatting.focus` is `trace`, this endpoint

        returns `409` — call `POST /traces/query` for that revision.


        ## Response


        Returns `{count, spans, windowing}`. One response holds at most one

        page: 100 spans when `windowing.limit` is not set, and never more than

        1000 (the server settings `AGENTA_API_TRACING_QUERY_DEFAULT_LIMIT` and

        `AGENTA_API_TRACING_QUERY_MAX_LIMIT`). `windowing` is present when the page

        is full: send it as `windowing` to read the next page.


        Span `attributes` leave out `ag.data.parameters.agent.skills` (the

        skill text of an agent run). `GET /spans/{trace_id}/{span_id}`,

        `GET /traces/{trace_id}` and a query that filters only on `trace_id`

        return it.


        For the nested per-trace shape, call

        `POST /traces/query` or `POST /tracing/spans/query` with

        `focus="trace"` instead.'
      operationId: query_spans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpansQueryRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpansResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /spans/analytics/query:
    post:
      tags:
      - Traces
      summary: Query Analytics
      operationId: query_spans_analytics
      parameters:
      - name: focus
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Focus'
          - type: 'null'
          title: Focus
      - name: format
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Format'
          - type: 'null'
          title: Format
      - name: oldest
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: integer
          - type: 'null'
          title: Oldest
      - name: newest
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: integer
          - type: 'null'
          title: Newest
      - name: interval
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Interval
      - name: rate
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: Rate
      - name: filter
        in: query
        required: false
        schema:
          title: Filter
      - name: specs
        in: query
        required: false
        schema:
          title: Specs
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
        '504':
          description: The analytics query ran past the database statement timeout. `detail` carries a message; retry with a shorter time range.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /spans/sessions/query:
    post:
      tags:
      - Traces
      summary: Query Sessions
      operationId: query_spans_sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionsQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionIdsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /spans/users/query:
    post:
      tags:
      - Traces
      summary: Query Users
      operationId: query_spans_users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserIdsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /spans/{trace_id}/{span_id}:
    get:
      tags:
      - Traces
      summary: Fetch Span
      description: 'Fetch a single span by `trace_id` + `span_id`.


        Returns `{count: 1, span}` when found and `{count: 0}` otherwise.

        Both IDs are required path parameters. Use this to drill in on one

        span from a trace waterfall without pulling the full tree.'
      operationId: fetch_span
      parameters:
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
          title: Trace Id
      - name: span_id
        in: path
        required: true
        schema:
          type: string
          title: Span Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simple/traces/:
    post:
      tags:
      - Traces
      summary: Create Trace
      description: 'Create a single-span "simple" trace.


        This endpoint is a higher-level helper for the common case of

        recording one self-contained event — an evaluator output, a human

        annotation, a feedback entry, a manually-logged inference. It

        creates one span under a fresh `trace_id` and returns the resulting

        handle.


        ## When to use this vs. `/tracing/spans/ingest`


        - **Use this endpoint** when you have a single payload to record

        with no internal hierarchy: evaluation results, human feedback,

        manual annotations, or a standalone completion. It takes care of

        `trace_id`/`span_id` generation, attribute namespacing, and link

        wiring for you.

        - **Use `POST /tracing/spans/ingest`** when you need multi-span

        traces (e.g. an agent run with nested tool calls and LLM spans),

        precise control over IDs, timings, or parent/child relationships,

        or when forwarding traces from another OTel-compatible source.


        ## Request body


        Send a `trace` object with:


        - `origin` — who produced the trace (`human`, `auto`, `custom`).

        - `kind` — intent (`adhoc`, `eval`, `play`).

        - `channel` — transport that produced it (`sdk`, `api`, `web`, `otlp`).

        - `data` — required dict carrying the actual payload (inputs,

        outputs, or evaluator results).

        - `tags`, `meta` — optional free-form dicts for filtering and

        metadata.

        - `references` — optional links to Agenta entities (application,

        variant, revision, evaluator, testset, etc.).

        - `links` — optional OTel-style links to other traces/spans.


        Use `PATCH /preview/tracing/traces/{trace_id}` to update fields

        later, `GET` to fetch, and `DELETE` to remove. See

        Tracing — References and links

        for when to use `references` vs. `links`.'
      operationId: create_simple_trace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimpleTraceCreateRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleTraceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simple/traces/{trace_id}:
    get:
      tags:
      - Traces
      summary: Fetch Trace
      description: 'Fetch a single "simple" trace by `trace_id`.


        Returns the high-level `SimpleTrace` view (origin, kind, channel,

        data, references, links) rather than the raw OTel span shape. Use

        this for evaluation results, feedback entries, and annotations

        created via `POST /simple/traces/`. For the span-level view of the

        same trace, call `GET /tracing/traces/{trace_id}`.'
      operationId: fetch_simple_trace
      parameters:
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
          title: Trace Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleTraceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Traces
      summary: Edit Trace
      description: 'Update an existing "simple" trace.


        Supplied fields overwrite the existing trace. Fields not present

        in the request body are left unchanged. `data` is required (the

        payload being recorded); `tags`, `meta`, `references`, and

        `links` are optional.


        This endpoint is intended for annotations and feedback entries,

        where the `data.outputs` is the part that typically gets revised.

        For span-level edits, use `PUT /tracing/traces/{trace_id}`.'
      operationId: edit_simple_trace
      parameters:
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
          title: Trace Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimpleTraceEditRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleTraceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Traces
      summary: Delete Trace
      description: 'Delete a "simple" trace.


        Removes the single-span trace created via

        `POST /simple/traces/`. Returns the `(trace_id, span_id)` pair

        that was removed, for logging or downstream cleanup. Use

        `DELETE /tracing/traces/{trace_id}` when operating on a

        multi-span trace.'
      operationId: delete_simple_trace
      parameters:
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
          title: Trace Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleTraceLinkResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simple/traces/query:
    post:
      tags:
      - Traces
      summary: Query Traces
      description: 'Query "simple" traces.


        Filter annotations and feedback by `origin`, `kind`, `channel`,

        `tags`, `meta`, `references`, and `links`. The shape of the

        request body is described in the

        Simple Endpoints

        guide, including the distinction between filtering via

        `trace.links` (inbound links on the trace) and the top-level

        `links` (batch GET by the trace''s own IDs).


        Use this endpoint when building feedback or annotation UIs.

        For span-level queries across all trace types, use

        `POST /tracing/spans/query`.'
      operationId: query_simple_traces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimpleTraceQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleTracesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    SimpleTraceKind:
      type: string
      enum:
      - adhoc
      - eval
      - play
      title: SimpleTraceKind
    AnalyticsResponse:
      properties:
        count:
          type: integer
          title: Count
          description: Number of time buckets returned.
          default: 0
        buckets:
          items:
            $ref: '#/components/schemas/MetricsBucket'
          type: array
          title: Buckets
          description: Time-bucketed aggregates. Each bucket's `metrics` dict is keyed by the dotted `path` of the corresponding `MetricSpec`, ordered oldest to newest.
          default: []
        query:
          $ref: '#/components/schemas/TracingQuery'
          description: The resolved query used to compute the buckets.
        specs:
          items:
            $ref: '#/components/schemas/MetricSpec'
          type: array
          title: Specs
          description: The resolved metric specs applied in each bucket.
          default: []
      type: object
      title: AnalyticsResponse
      description: Analytics response with user-specified metric specs.
    Format:
      type: string
      enum:
      - agenta
      - opentelemetry
      title: Format
    ListOptions:
      properties:
        all:
          anyOf:
          - type: boolean
          - type: 'null'
          title: All
          default: false
      type: object
      title: ListOptions
    Filtering-Input:
      properties:
        operator:
          $ref: '#/components/schemas/LogicalOperator'
          default: and
        conditions:
          items:
            anyOf:
            - $ref: '#/components/schemas/Condition'
            - $ref: '#/components/schemas/Filtering-Input'
          type: array
          title: Conditions
          default: []
      type: object
      title: Filtering
    Condition:
      properties:
        field:
          type: string
          title: Field
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
        value:
          anyOf:
          - type: string
          - type: integer
          - type: number
          - type: boolean
          - items: {}
            type: array
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Value
        operator:
          anyOf:
          - $ref: '#/components/schemas/ComparisonOperator'
          - $ref: '#/components/schemas/NumericOperator'
          - $ref: '#/components/schemas/StringOperator'
          - $ref: '#/components/schemas/ListOperator'
          - $ref: '#/components/schemas/DictOperator'
          - $ref: '#/components/schemas/ExistenceOperator'
          - type: 'null'
          title: Operator
          default: is
        options:
          anyOf:
          - $ref: '#/components/schemas/TextOptions'
          - $ref: '#/components/schemas/ListOptions'
          - type: 'null'
          title: Options
      type: object
      required:
      - field
      title: Condition
    Windowing:
      properties:
        newest:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Newest
        oldest:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Oldest
        next:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Next
        limit:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
        order:
          anyOf:
          - type: string
            enum:
            - ascending
            - descending
          - type: 'null'
          title: Order
        interval:
          anyOf:
          - type: integer
          - type: 'null'
          title: Interval
        rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Rate
      type: object
      title: Windowing
    SimpleTraceLinkResponse:
      properties:
        count:
          type: integer
          title: Count
          description: '`1` if a trace was removed, `0` otherwise.'
          default: 0
        link:
          anyOf:
          - $ref: '#/components/schemas/OTelLink-Output'
          - type: 'null'
          description: The `(trace_id, span_id)` pair that was removed.
      type: object
      title: SimpleTraceLinkResponse
      description: Response from `DELETE /simple/traces/{trace_id}`.
    TraceIdResponse:
      properties:
        count:
